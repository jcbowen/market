# Docker 外部数据库部署配置
#
# 使用外部 MySQL / Redis 时，使用此文件替代默认 docker-compose.yml。
# 连接凭据与拓扑均在项目根目录 .env 配置（compose 自动读取）：
#   必填：MYSQL_PASSWORD / REDIS_PASSWORD / JWT_SECRET / DB_HOST / REDIS_HOST
#   可选：DB_PORT / DB_NAME / DB_USER / REDIS_PORT / REDIS_DB（留空走 config.docker.yaml 默认值）
# 无需修改 bin/config.docker.yaml（其默认 host 面向内部 compose 拓扑，经环境变量覆盖）。
#
# 启动命令：
#   docker compose -f docker-compose.external-db.yml up -d

services:
  # ===== 微服务 =====
  # 与默认 docker-compose.yml 一致：统一 restart: unless-stopped，宿主机重启或 OOM 后自愈
  user-service:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.service
      args:
        SERVICE_NAME: user
        SERVICE_PORT: 50051
    container_name: market-user
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 敏感凭据经环境变量注入，服务启动时覆盖配置文件中的空占位
      # （common/config.ApplyEnvOverrides；外部 DB 部署凭据在宿主 .env 提供）
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在项目根目录 .env 中配置 MYSQL_PASSWORD（外部 MySQL 口令）}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在项目根目录 .env 中配置 REDIS_PASSWORD（外部 Redis 口令）}
      JWT_SECRET: ${JWT_SECRET:?请在项目根目录 .env 中配置 JWT_SECRET（至少 32 位随机串；默认占位值是公开值，服务会拒绝启动）}
      # 连接拓扑经环境变量注入（common/config.ApplyEnvOverrides）：外部实例地址必填
      # （容器内无数据库，config.docker.yaml 的默认 host 指向内部服务名 mysql/redis），
      # 端口/库名/用户留空走配置文件默认值，换环境只改 .env 不动手改入库配置
      DB_HOST: ${DB_HOST:?请在项目根目录 .env 中配置 DB_HOST（外部 MySQL 地址）}
      DB_PORT: ${DB_PORT:-}
      DB_NAME: ${DB_NAME:-}
      DB_USER: ${DB_USER:-}
      REDIS_HOST: ${REDIS_HOST:?请在项目根目录 .env 中配置 REDIS_HOST（外部 Redis 地址）}
      REDIS_PORT: ${REDIS_PORT:-}
      REDIS_DB: ${REDIS_DB:-}
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
    command: >
      sh -c "cp -f /app/config.yaml /app/config.runtime.yaml && CONFIG_FILE=/app/config.runtime.yaml ./service"

  product-service:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.service
      args:
        SERVICE_NAME: product
        SERVICE_PORT: 50052
    container_name: market-product
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 敏感凭据经环境变量注入，服务启动时覆盖配置文件中的空占位
      # （common/config.ApplyEnvOverrides；外部 DB 部署凭据在宿主 .env 提供）
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在项目根目录 .env 中配置 MYSQL_PASSWORD（外部 MySQL 口令）}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在项目根目录 .env 中配置 REDIS_PASSWORD（外部 Redis 口令）}
      JWT_SECRET: ${JWT_SECRET:?请在项目根目录 .env 中配置 JWT_SECRET（至少 32 位随机串；默认占位值是公开值，服务会拒绝启动）}
      # 连接拓扑经环境变量注入（common/config.ApplyEnvOverrides）：外部实例地址必填
      # （容器内无数据库，config.docker.yaml 的默认 host 指向内部服务名 mysql/redis），
      # 端口/库名/用户留空走配置文件默认值，换环境只改 .env 不动手改入库配置
      DB_HOST: ${DB_HOST:?请在项目根目录 .env 中配置 DB_HOST（外部 MySQL 地址）}
      DB_PORT: ${DB_PORT:-}
      DB_NAME: ${DB_NAME:-}
      DB_USER: ${DB_USER:-}
      REDIS_HOST: ${REDIS_HOST:?请在项目根目录 .env 中配置 REDIS_HOST（外部 Redis 地址）}
      REDIS_PORT: ${REDIS_PORT:-}
      REDIS_DB: ${REDIS_DB:-}
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
      # 本地附件共享目录：product 落盘与 gateway /uploads 静态服务共用同一宿主目录，
      # 目录不存在时由启动脚本或 Docker 自动创建
      - ./bin/uploads:/app/uploads
    command: >
      sh -c "cp -f /app/config.yaml /app/config.runtime.yaml && CONFIG_FILE=/app/config.runtime.yaml ./service"

  order-service:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.service
      args:
        SERVICE_NAME: order
        SERVICE_PORT: 50053
    container_name: market-order
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 敏感凭据经环境变量注入，服务启动时覆盖配置文件中的空占位
      # （common/config.ApplyEnvOverrides；外部 DB 部署凭据在宿主 .env 提供）
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在项目根目录 .env 中配置 MYSQL_PASSWORD（外部 MySQL 口令）}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在项目根目录 .env 中配置 REDIS_PASSWORD（外部 Redis 口令）}
      JWT_SECRET: ${JWT_SECRET:?请在项目根目录 .env 中配置 JWT_SECRET（至少 32 位随机串；默认占位值是公开值，服务会拒绝启动）}
      # 连接拓扑经环境变量注入（common/config.ApplyEnvOverrides）：外部实例地址必填
      # （容器内无数据库，config.docker.yaml 的默认 host 指向内部服务名 mysql/redis），
      # 端口/库名/用户留空走配置文件默认值，换环境只改 .env 不动手改入库配置
      DB_HOST: ${DB_HOST:?请在项目根目录 .env 中配置 DB_HOST（外部 MySQL 地址）}
      DB_PORT: ${DB_PORT:-}
      DB_NAME: ${DB_NAME:-}
      DB_USER: ${DB_USER:-}
      REDIS_HOST: ${REDIS_HOST:?请在项目根目录 .env 中配置 REDIS_HOST（外部 Redis 地址）}
      REDIS_PORT: ${REDIS_PORT:-}
      REDIS_DB: ${REDIS_DB:-}
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
    command: >
      sh -c "cp -f /app/config.yaml /app/config.runtime.yaml && CONFIG_FILE=/app/config.runtime.yaml ./service"

  cart-service:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.service
      args:
        SERVICE_NAME: cart
        SERVICE_PORT: 50054
    container_name: market-cart
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 敏感凭据经环境变量注入，服务启动时覆盖配置文件中的空占位
      # （common/config.ApplyEnvOverrides；外部 DB 部署凭据在宿主 .env 提供）
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在项目根目录 .env 中配置 MYSQL_PASSWORD（外部 MySQL 口令）}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在项目根目录 .env 中配置 REDIS_PASSWORD（外部 Redis 口令）}
      JWT_SECRET: ${JWT_SECRET:?请在项目根目录 .env 中配置 JWT_SECRET（至少 32 位随机串；默认占位值是公开值，服务会拒绝启动）}
      # 连接拓扑经环境变量注入（common/config.ApplyEnvOverrides）：外部实例地址必填
      # （容器内无数据库，config.docker.yaml 的默认 host 指向内部服务名 mysql/redis），
      # 端口/库名/用户留空走配置文件默认值，换环境只改 .env 不动手改入库配置
      DB_HOST: ${DB_HOST:?请在项目根目录 .env 中配置 DB_HOST（外部 MySQL 地址）}
      DB_PORT: ${DB_PORT:-}
      DB_NAME: ${DB_NAME:-}
      DB_USER: ${DB_USER:-}
      REDIS_HOST: ${REDIS_HOST:?请在项目根目录 .env 中配置 REDIS_HOST（外部 Redis 地址）}
      REDIS_PORT: ${REDIS_PORT:-}
      REDIS_DB: ${REDIS_DB:-}
    depends_on:
      product-service:
        condition: service_started
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
    command: >
      sh -c "cp -f /app/config.yaml /app/config.runtime.yaml && CONFIG_FILE=/app/config.runtime.yaml ./service"

  payment-service:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.service
      args:
        SERVICE_NAME: payment
        SERVICE_PORT: 50055
    container_name: market-payment
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 敏感凭据经环境变量注入，服务启动时覆盖配置文件中的空占位
      # （common/config.ApplyEnvOverrides；外部 DB 部署凭据在宿主 .env 提供）
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在项目根目录 .env 中配置 MYSQL_PASSWORD（外部 MySQL 口令）}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在项目根目录 .env 中配置 REDIS_PASSWORD（外部 Redis 口令）}
      JWT_SECRET: ${JWT_SECRET:?请在项目根目录 .env 中配置 JWT_SECRET（至少 32 位随机串；默认占位值是公开值，服务会拒绝启动）}
      # 连接拓扑经环境变量注入（common/config.ApplyEnvOverrides）：外部实例地址必填
      # （容器内无数据库，config.docker.yaml 的默认 host 指向内部服务名 mysql/redis），
      # 端口/库名/用户留空走配置文件默认值，换环境只改 .env 不动手改入库配置
      DB_HOST: ${DB_HOST:?请在项目根目录 .env 中配置 DB_HOST（外部 MySQL 地址）}
      DB_PORT: ${DB_PORT:-}
      DB_NAME: ${DB_NAME:-}
      DB_USER: ${DB_USER:-}
      REDIS_HOST: ${REDIS_HOST:?请在项目根目录 .env 中配置 REDIS_HOST（外部 Redis 地址）}
      REDIS_PORT: ${REDIS_PORT:-}
      REDIS_DB: ${REDIS_DB:-}
    depends_on:
      order-service:
        condition: service_started
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
    command: >
      sh -c "cp -f /app/config.yaml /app/config.runtime.yaml && CONFIG_FILE=/app/config.runtime.yaml ./service"

  gateway:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.gateway
    container_name: market-gateway
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 敏感凭据经环境变量注入，服务启动时覆盖配置文件中的空占位
      # （common/config.ApplyEnvOverrides；外部 DB 部署凭据在宿主 .env 提供）
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在项目根目录 .env 中配置 MYSQL_PASSWORD（外部 MySQL 口令）}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在项目根目录 .env 中配置 REDIS_PASSWORD（外部 Redis 口令）}
      JWT_SECRET: ${JWT_SECRET:?请在项目根目录 .env 中配置 JWT_SECRET（至少 32 位随机串；默认占位值是公开值，服务会拒绝启动）}
      # 连接拓扑经环境变量注入（common/config.ApplyEnvOverrides）：外部实例地址必填
      # （容器内无数据库，config.docker.yaml 的默认 host 指向内部服务名 mysql/redis），
      # 端口/库名/用户留空走配置文件默认值，换环境只改 .env 不动手改入库配置
      DB_HOST: ${DB_HOST:?请在项目根目录 .env 中配置 DB_HOST（外部 MySQL 地址）}
      DB_PORT: ${DB_PORT:-}
      DB_NAME: ${DB_NAME:-}
      DB_USER: ${DB_USER:-}
      REDIS_HOST: ${REDIS_HOST:?请在项目根目录 .env 中配置 REDIS_HOST（外部 Redis 地址）}
      REDIS_PORT: ${REDIS_PORT:-}
      REDIS_DB: ${REDIS_DB:-}
      # 可信反向代理网段（逗号分隔 CIDR/IP），与 docker-compose.yml 同口径：
      # 留空 = 不采信任何代理头；宿主 nginx 反代时必填其网段，详见 07-基础设施/02 与开发计划第 69 项
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # 可信平台专用头（前置 CDN 时填代理强制覆盖写入的客户端真实 IP 头，客户端伪造无效），
      # 如阿里云 CDN 填 Ali-CDN-Real-IP；与 TRUSTED_PROXIES 同口径，留空不启用
      TRUSTED_PLATFORM: ${TRUSTED_PLATFORM:-}
      # 部署域名基址（scheme://host，不含路径），仅 gateway 需要：作为后台「站点设置」的
      # 兜底默认值，支付回调地址/附件外链/HTML 品牌注入按生效域名派生。留空按当前请求域名现推
      SITE_BASE_URL: ${SITE_BASE_URL:-}
      # debugger 临时排查开关与白名单（与主 compose 同口径：留空 = 不覆盖配置文件；
      # 两行都给才既记日志又开页面，只给 ENABLED 不给白名单时页面不注册 fail-closed）
      DEBUGGER_ENABLED: ${DEBUGGER_ENABLED:-}
      DEBUGGER_ALLOWED_IPS: ${DEBUGGER_ALLOWED_IPS:-}
      # 运行环境标识：gateway 据此判定生产（IsProduction→EnsureSecureJWT 无视
      # JWT_ALLOW_INSECURE_DEV 放行、fail-fast），后台「关于」页同源显示；留空 = 非生产
      APP_ENV: ${APP_ENV:-}
      # 后台版本检查源（gateway/handler/update.go 直读环境变量，不经配置文件）：
      # 留空走内置默认（jcbowen/market + 官方 Docker Hub API），设 off/none/disable 关闭对应源
      DOCKERHUB_REPO: ${DOCKERHUB_REPO:-}
      GHCR_REPO: ${GHCR_REPO:-}
      DOCKERHUB_API_BASE: ${DOCKERHUB_API_BASE:-}
    depends_on:
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      cart-service:
        condition: service_started
      payment-service:
        condition: service_started
    ports:
      - "18080:18080"
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
      # 本地附件共享目录：与 product-service 挂载同一宿主目录，
      # /uploads 静态路由（<exe 同级>/attachment）读取 product 落盘的附件
      - ./bin/uploads:/app/uploads
      # 登录密码加密 RSA 私钥（安全敏感，不入 git）：首次启动自动生成并落盘持久化，
      # 容器重建 key_id 不变；多实例/负载均衡部署挂载同一宿主文件即共享同一密钥对
      - ./bin/data/ssl:/app/data/ssl
      # 开发阶段挂载宿主机前端编译产物，避免每次修改都重新构建 gateway 镜像
      - ./bin/static/admin:/app/static/admin:ro
      - ./bin/static/h5:/app/static/h5:ro
    command: >
      sh -c "cp -f /app/config.yaml /app/config.runtime.yaml && CONFIG_FILE=/app/config.runtime.yaml ./gateway"
