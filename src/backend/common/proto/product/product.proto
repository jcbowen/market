  // 状态筛选：1未使用 2已使用 3已过期（0=全部）
  int32 status = 3;
  // 来源筛选：1用户自领 2后台发放（0=全部）
  int32 source = 4;
  // 社区语境（用于把记录范围限定在本社区发放的券，防跨社区泄露）
  int64 community_id = 5;
  common.Pagination pagination = 6;
}

