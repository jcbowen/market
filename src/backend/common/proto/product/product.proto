message GrantCouponReq {
  int64 coupon_id = 1;
  // 发放目标会员（批量；逐人独立校验，单人不合格不影响其他人）
  repeated int64 user_ids = 2;
  // 发放操作者（管理员）ID 与用户名快照
  int64 operator_id = 3;
  string operator_name = 4;
  // 操作者社区语境（>0 时校验券归属社区，跨社区发放直接拒绝）
  int64 community_id = 5;
}

