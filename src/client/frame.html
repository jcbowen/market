<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>社区商超</title>
		<link rel="stylesheet" href="static/phone-frame.css" />
	</head>
	<body class="frame-mode">
		<div id="frame-shell" class="device-frame">
			<!-- 顶部额区装饰：状态栏（时间 + 信号/WiFi/电池）、听筒格栅、前置摄像头（均位于让出的边框区内，不遮挡嵌套页面） -->
			<div class="device-status-bar">
				<span class="status-time"></span>
				<span class="status-icons">
					<svg class="status-signal" width="15" height="10" viewBox="0 0 15 10">
						<rect x="0" y="6.5" width="2.6" height="3.5" rx="0.8" fill="#fff" />
						<rect x="4" y="4.5" width="2.6" height="5.5" rx="0.8" fill="#fff" />
						<rect x="8" y="2.2" width="2.6" height="7.8" rx="0.8" fill="#fff" />
						<rect x="12" y="0" width="2.6" height="10" rx="0.8" fill="#fff" opacity=".4" />
					</svg>
					<svg class="status-wifi" width="14" height="11" viewBox="0 0 14 11" fill="none">
						<path d="M1 4a8.5 8.5 0 0 1 12 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />
						<path d="M3.2 6.5a5.4 5.4 0 0 1 7.6 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />
						<circle cx="7" cy="9.3" r="1.4" fill="#fff" />
					</svg>
					<i class="status-battery"></i>
				</span>
			</div>
			<div class="device-earpiece"></div>
			<div class="device-camera"></div>
			<iframe
				id="app-frame"
				class="device-screen"
				frameborder="0"
				title="社区商超"
			></iframe>
			<!-- 底部颏区装饰：Home 指示条 -->
			<div class="device-home-indicator"></div>
			<!-- 侧边实体键：静音拨键 + 音量键（左）、电源键（右） -->
			<div class="device-volume-switch"></div>
			<div class="device-volume-key"></div>
			<div class="device-button"></div>
			<!-- 机身右侧二维码：引导手机扫码访问 H5（内容随当前访问地址自动正确） -->
			<div class="device-qr">
				<div class="qr-code" id="qr-code"></div>
				<div class="qr-tip">手机扫码访问</div>
				<div class="qr-url" id="qr-url"></div>
			</div>
		</div>

		<script>
			/**
			 * 窄屏自动切换 App 模式：
			 * 真手机/模拟手机（视口宽度 < 768px）不需要手机边框壳，
			 * 直接跳转到同目录下的 app.html 全屏直出应用，避免小屏下
			 * Frame 模式容器样式（@media min-width:768px）不生效导致布局塌陷。
			 * 使用 location.replace 避免污染浏览历史，hash 一并携带保持当前页面。
			 */
			if (window.matchMedia('(max-width: 767.98px)').matches) {
				location.replace('./app.html' + window.location.hash)
			}

			/**
			 * PC 端模拟手机边框入口
			 * 通过 iframe 加载真实 H5 应用，使内部 fixed 定位元素（顶部导航栏、底部 tabBar）
			 * 相对于 iframe 自身视口固定，避免外层 transform 缩放导致滚动时一起移动。
			 */
			(function () {
				var frame = document.getElementById('app-frame')

				/**
				 * 根据运行环境选择 iframe 加载的应用入口：
				 * - 开发环境（vite dev server，端口通常为 5173）：加载同目录下的 index.html
				 * - 生产环境（构建产物）：加载重命名后的 app.html
				 */
				var appSrc = location.port === '5173' ? './index.html' : './app.html'
				frame.src = appSrc + window.location.hash

				/**
				 * 根据视口大小计算手机边框容器的缩放比例，确保在 PC 屏幕内完整显示。
				 * 宽度方向保留 40px 边距，高度方向保留 10% 边距，缩放比例不超过 1。
				 */
				function updateDeviceScale() {
					var width = window.innerWidth
					var height = window.innerHeight
					var root = document.documentElement
					if (width < 768) {
						root.style.removeProperty('--device-scale')
						return
					}
					var scaleX = (width - 40) / 375
					var scaleY = (height * 0.9) / 750
					var scale = Math.min(scaleX, scaleY, 1)
					root.style.setProperty('--device-scale', scale.toFixed(4))
				}

				updateDeviceScale()
				window.addEventListener('resize', updateDeviceScale)
				window.addEventListener('orientationchange', updateDeviceScale)

				/**
			 * 同步 iframe 内部 hash 路由到外层地址栏，刷新时可保持当前页面。
			 * 同时监听外层 hash 变化，将新 hash 同步到 iframe 内部，支持通过外链直接访问指定路由。
			 * 仅同步 hash 部分，不影响 iframe 内部路由。
			 */
			frame.addEventListener('load', function () {
				try {
					var frameWindow = frame.contentWindow
					if (!frameWindow) return

					// iframe -> 外层
					frameWindow.addEventListener('hashchange', function () {
						if (window.location.hash !== frameWindow.location.hash) {
							window.location.hash = frameWindow.location.hash
						}
					})

					// 外层 -> iframe
					window.addEventListener('hashchange', function () {
						if (frameWindow.location.hash !== window.location.hash) {
							frameWindow.location.hash = window.location.hash
						}
					})
				} catch (e) {
					// 跨域时忽略同步
				}
			})
		})()
		</script>

		<script src="static/qrcode.min.js"></script>
		<script>
			/**
			 * 额区状态栏真实时间：每 15 秒刷新，与真机状态栏一致。
			 */
			;(function () {
				var pad = function (n) {
					return String(n).padStart(2, '0')
				}
				var update = function () {
					var d = new Date()
					var el = document.querySelector('.status-time')
					if (el) {
						el.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes())
					}
				}
				update()
				setInterval(update, 15000)
			})()

			/**
			 * 机身右侧二维码：指向当前 origin 的 /s/ 入口。
			 * 手机扫码后由入口页宽窄屏检测自动进入全屏 App 模式；
			 * 注意二维码内容取自地址栏 origin，需以局域网 IP 访问本页，手机方可打开。
			 */
			;(function () {
				var url = window.location.origin + '/s/'
				var box = document.getElementById('qr-code')
				if (box && typeof qrcode === 'function') {
					var qr = qrcode(0, 'M')
					qr.addData(url)
					qr.make()
					box.innerHTML = qr.createSvgTag({ cellSize: 3, margin: 0 })
				}
				var urlEl = document.getElementById('qr-url')
				if (urlEl) {
					urlEl.textContent = url
				}
			})()
		</script>
	</body>
</html>
