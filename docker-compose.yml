services:
  # ===== 基础设施 =====
  # 口令一律经项目根目录 .env 注入（compose 自动读取，.env 不入 git），
  # 缺失时直接报错拒绝启动，防止弱口令静默上线
  # 全部服务统一 restart: unless-stopped：宿主机重启或 OOM 后自愈，
  # 与 docs/需求文档/10-部署方案 中 all-in-one 的 --restart unless-stopped 口径一致
  # 微服务容器以非 root（UID 10001）运行：Linux 部署时宿主写目录需执行
  # chown -R 10001:10001 bin/runtime bin/uploads（Docker Desktop 无需处理）
  mysql:
    image: mysql:8.0
    container_name: market-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在项目根目录 .env 中配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: market
      TZ: Asia/Shanghai
    ports:
      # 仅绑定回环地址：3306 是数据库端口，暴露到 0.0.0.0 等同数据库对公网开放；
      # 应用容器经 compose 内部网络访问，无需对外映射
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: market-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在项目根目录 .env 中配置 REDIS_PASSWORD}
    ports:
      # 仅绑定回环地址：未授权 Redis 可被任意来源直连写入，属高危暴露
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== 微服务 =====
  # 每个微服务容器内置 gRPC 端口 TCP 健康检查（见 Dockerfile HEALTHCHECK），
  # 下游依赖一律 service_healthy：上游容器等下游真正可服务后再启动
  user-service:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.service
      args:
        SERVICE_NAME: user
        # gRPC 监听端口：与 bin/config.docker.yaml 的 user_service.grpc_port 同源，
        # 传入镜像供 HEALTHCHECK 探测正确端口
        SERVICE_PORT: 50051
    container_name: market-user
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 敏感凭据经环境变量注入，服务启动时覆盖配置文件中的空占位（common/config.ApplyEnvOverrides）
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在项目根目录 .env 中配置 JWT_SECRET（至少 32 位随机串；默认占位值是公开值，服务会拒绝启动）}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
    command: >
      sh -c "cp -f /app/config.yaml /app/config.runtime.yaml && CONFIG_FILE=/app/config.runtime.yaml ./service"

  product-service:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.service
      args:
        SERVICE_NAME: product
        SERVICE_PORT: 50052
    container_name: market-product
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 敏感凭据经环境变量注入，服务启动时覆盖配置文件中的空占位（common/config.ApplyEnvOverrides）
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在项目根目录 .env 中配置 JWT_SECRET（至少 32 位随机串；默认占位值是公开值，服务会拒绝启动）}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
      # 本地附件共享目录：product 落盘与 gateway /uploads 静态服务共用同一宿主目录，
      # 目录不存在时由启动脚本或 Docker 自动创建
      - ./bin/uploads:/app/uploads
    command: >
      sh -c "cp -f /app/config.yaml /app/config.runtime.yaml && CONFIG_FILE=/app/config.runtime.yaml ./service"

  order-service:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.service
      args:
        SERVICE_NAME: order
        SERVICE_PORT: 50053
    container_name: market-order
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 敏感凭据经环境变量注入，服务启动时覆盖配置文件中的空占位（common/config.ApplyEnvOverrides）
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在项目根目录 .env 中配置 JWT_SECRET（至少 32 位随机串；默认占位值是公开值，服务会拒绝启动）}
      # debugger 进程级日志（与 gateway 共享 debug_logs 表，供订单调度器等异步进程记录摘要）：
      # 开关随部署环境注入（DEBUGGER_ENABLED，与 gateway 同源，留空=沿用配置文件的 enabled: false）；
      # service_name 按进程名硬编码——compose 下各服务共用一份配置模板（值均为 gateway），
      # 不覆写则进程记录全部顶着 gateway 标识，无法区分来源
      # （allinone 部署由 entrypoint sed 覆写配置副本，无需此变量）
      DEBUGGER_ENABLED: ${DEBUGGER_ENABLED:-}
      DEBUGGER_SERVICE_NAME: order-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
      # 本地附件共享目录：order 导出 CSV 落盘与 gateway 下载流式下发共用同一宿主目录，
      # 与 product-service 的挂载保持一致；缺此挂载时导出文件写进容器临时层，
      # gateway 侧 c.File 找不到文件，下载恒 404（2026-10-24 下载中心联调实测）
      - ./bin/uploads:/app/uploads
    command: >
      sh -c "cp -f /app/config.yaml /app/config.runtime.yaml && CONFIG_FILE=/app/config.runtime.yaml ./service"

  cart-service:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.service
      args:
        SERVICE_NAME: cart
        SERVICE_PORT: 50054
    container_name: market-cart
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 敏感凭据经环境变量注入，服务启动时覆盖配置文件中的空占位（common/config.ApplyEnvOverrides）
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在项目根目录 .env 中配置 JWT_SECRET（至少 32 位随机串；默认占位值是公开值，服务会拒绝启动）}
    depends_on:
      redis:
        condition: service_healthy
      product-service:
        condition: service_healthy
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
    command: >
      sh -c "cp -f /app/config.yaml /app/config.runtime.yaml && CONFIG_FILE=/app/config.runtime.yaml ./service"

  payment-service:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.service
      args:
        SERVICE_NAME: payment
        SERVICE_PORT: 50055
    container_name: market-payment
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 敏感凭据经环境变量注入，服务启动时覆盖配置文件中的空占位（common/config.ApplyEnvOverrides）
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在项目根目录 .env 中配置 JWT_SECRET（至少 32 位随机串；默认占位值是公开值，服务会拒绝启动）}
      # debugger 进程级日志（与 gateway 共享 debug_logs 表，供对账调度器等异步进程记录摘要）：
      # 开关随部署环境注入（DEBUGGER_ENABLED，与 gateway 同源，留空=沿用配置文件的 enabled: false）；
      # service_name 按进程名硬编码——compose 下各服务共用一份配置模板（值均为 gateway），
      # 不覆写则进程记录全部顶着 gateway 标识，无法区分来源
      # （allinone 部署由 entrypoint sed 覆写配置副本，无需此变量）
      DEBUGGER_ENABLED: ${DEBUGGER_ENABLED:-}
      DEBUGGER_SERVICE_NAME: payment-service
    depends_on:
      mysql:
        condition: service_healthy
      order-service:
        condition: service_healthy
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
    command: >
      sh -c "cp -f /app/config.yaml /app/config.runtime.yaml && CONFIG_FILE=/app/config.runtime.yaml ./service"

  gateway:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.gateway
    container_name: market-gateway
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 敏感凭据经环境变量注入，服务启动时覆盖配置文件中的空占位（common/config.ApplyEnvOverrides）
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在项目根目录 .env 中配置 JWT_SECRET（至少 32 位随机串；默认占位值是公开值，服务会拒绝启动）}
      # 可信反向代理网段（逗号分隔的 CIDR 或单个 IP），仅 gateway 需要（ClientIP/限流只在网关侧）。
      # 生产为宿主机 nginx 反代容器发布端口时，必须填 compose 网络实际网段
      # （docker network inspect market_default 取 Configurations.Subnet），否则限流与访问日志
      # 会把所有用户合并成网桥地址；留空即不采信任何代理头（按直连 IP 处理）；
      # 填 0.0.0.0/0 等于允许伪造 X-Forwarded-For 绕过限流，禁止。
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # 可信平台专用头（前置 CDN 时填代理强制覆盖写入的客户端真实 IP 头，客户端伪造无效）：
      # 阿里云 CDN 填 Ali-CDN-Real-IP，Cloudflare 填 CF-Connecting-IP；CDN 回源 IP 无固定段
      # 不可枚举，靠放行网段拿真实 IP 不可行，此时用本项让白名单/限流拿到真实 IP；留空不启用
      TRUSTED_PLATFORM: ${TRUSTED_PLATFORM:-}
      # 部署域名基址（scheme://host，不含路径），仅 gateway 需要：作为后台「站点设置」的兜底默认值
      # （站点设置页会回填该值，保存后以站点设置为准），支付回调地址、附件外链与 HTML 品牌注入按生效域名派生。
      # 本地与自动化测试保持留空——留空时按当前请求域名现推，测试用例据此断言派生值。
      SITE_BASE_URL: ${SITE_BASE_URL:-}
      # debugger 临时排查开关与白名单（默认空 = 不覆盖配置文件；两行都给才既记日志又开页面，
      # 只给 ENABLED 不给白名单时页面不注册 fail-closed）。用法见部署文档「临时开启请求日志排查」
      DEBUGGER_ENABLED: ${DEBUGGER_ENABLED:-}
      DEBUGGER_ALLOWED_IPS: ${DEBUGGER_ALLOWED_IPS:-}
      # 运行环境标识：gateway 据此判定生产（IsProduction→EnsureSecureJWT 无视
      # JWT_ALLOW_INSECURE_DEV 放行、fail-fast），后台「关于」页同源显示；留空 = 非生产
      APP_ENV: ${APP_ENV:-}
      # 生产 HTTPS 兜底开关（仅 gateway 读取）：APP_ENV=production 时密码类接口拒绝非 HTTPS
      # 请求（11011）。留空 = 兜底开启（默认）；前置链路（如 CDN/DCDN 动态回源协议）一时无法
      # 保证 HTTPS 回源时可临时设 false 关闭兜底——此时若回源仍是 HTTP，登录密码与 token 明文
      # 过网，链路修复（DCDN 跟随回源生效）后应删除本项恢复兜底
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-}
      # 后台版本检查源（gateway/handler/update.go 直读环境变量，不经配置文件）：
      # 留空走内置默认（jcbowen/market + 官方 Docker Hub API），设 off/none/disable 关闭对应源；
      # DOCKERHUB_API_BASE 国内网络不通时可指向 Registry 镜像代理基地址
      DOCKERHUB_REPO: ${DOCKERHUB_REPO:-}
      GHCR_REPO: ${GHCR_REPO:-}
      DOCKERHUB_API_BASE: ${DOCKERHUB_API_BASE:-}
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    ports:
      - "18080:18080"
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
      # 运行时配置持久化：支付设置等写回 ./bin/runtime/config.yaml，容器重启不丢失
      - ./bin/runtime:/app/runtime
      # 本地附件共享目录：与 product-service 挂载同一宿主目录，
      # /uploads 静态路由（<exe 同级>/attachment）读取 product 落盘的附件
      - ./bin/uploads:/app/uploads
      # IP 定位数据库（GeoLite2-City）：由 geoip-download（go run ./cmd/geoip-download
      # 或发布包内二进制）下载更新（不入 git），目录未初始化时 IP 定位接口优雅降级；
      # 挂载可写，缺失时容器内亦可自动补下载
      - ./bin/data/geoip:/app/data/geoip
      # 登录密码加密 RSA 私钥（安全敏感，不入 git）：首次启动自动生成并落盘持久化，
      # 容器重建 key_id 不变；多实例/负载均衡部署挂载同一宿主文件即共享同一密钥对。
      # Linux 宿主需 chown -R 10001:10001 bin/data/ssl（Docker Desktop/VirtioFS 无需处理）
      - ./bin/data/ssl:/app/data/ssl
      # 开发阶段挂载宿主机前端编译产物，避免每次修改都重新构建 gateway 镜像
      - ./bin/static/admin:/app/static/admin:ro
      - ./bin/static/h5:/app/static/h5:ro
    # runtime/config.yaml 为 bind mount：Windows Docker Desktop 9p 会把上次会话遗留的
    # 宿主文件映射为 0755 root:root，appuser(10001) 不可覆写（框架每次启动都会回写配置，
    # 权限不足会直接启动失败）。目录本身 0777 可写，故启动前检测：不可写则删除后从模板重建。
    # Linux 宿主已 chown 10001:10001，-w 恒为真，不影响生产。
    command: >
      sh -c "[ -w /app/runtime/config.yaml ] || rm -f /app/runtime/config.yaml; [ -f /app/runtime/config.yaml ] || cp -f /app/config.yaml /app/runtime/config.yaml; CONFIG_FILE=/app/runtime/config.yaml ./gateway"

volumes:
  mysql_data:
  redis_data:
