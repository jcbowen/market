services:
  # ===== 基础设施 =====
  mysql:
    image: mysql:8.0
    container_name: market-mysql
    environment:
      MYSQL_ROOT_PASSWORD: market123
      MYSQL_DATABASE: market
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: market-redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== 微服务 =====
  user-service:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.service
      args:
        SERVICE_NAME: user
    container_name: market-user
    environment:
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
    command: >
      sh -c "cp -f /app/config.yaml /app/config.runtime.yaml && CONFIG_FILE=/app/config.runtime.yaml ./service"

  product-service:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.service
      args:
        SERVICE_NAME: product
    container_name: market-product
    environment:
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
      # 本地附件共享目录：product 落盘与 gateway /uploads 静态服务共用同一宿主目录，
      # 目录不存在时由启动脚本或 Docker 自动创建
      - ./bin/attachment:/app/attachment
    command: >
      sh -c "cp -f /app/config.yaml /app/config.runtime.yaml && CONFIG_FILE=/app/config.runtime.yaml ./service"

  order-service:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.service
      args:
        SERVICE_NAME: order
    container_name: market-order
    environment:
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
    command: >
      sh -c "cp -f /app/config.yaml /app/config.runtime.yaml && CONFIG_FILE=/app/config.runtime.yaml ./service"

  cart-service:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.service
      args:
        SERVICE_NAME: cart
    container_name: market-cart
    environment:
      TZ: Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
      product-service:
        condition: service_started
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
    command: >
      sh -c "cp -f /app/config.yaml /app/config.runtime.yaml && CONFIG_FILE=/app/config.runtime.yaml ./service"

  payment-service:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.service
      args:
        SERVICE_NAME: payment
    container_name: market-payment
    environment:
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      order-service:
        condition: service_started
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
    command: >
      sh -c "cp -f /app/config.yaml /app/config.runtime.yaml && CONFIG_FILE=/app/config.runtime.yaml ./service"

  gateway:
    build:
      context: .
      dockerfile: src/backend/deploy/Dockerfile.gateway
    container_name: market-gateway
    environment:
      TZ: Asia/Shanghai
    depends_on:
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      cart-service:
        condition: service_started
      payment-service:
        condition: service_started
    ports:
      - "18080:18080"
    volumes:
      - ./bin/config.docker.yaml:/app/config.yaml:ro
      # 运行时配置持久化：支付设置等写回 ./bin/runtime/config.yaml，容器重启不丢失
      - ./bin/runtime:/app/runtime
      # 本地附件共享目录：与 product-service 挂载同一宿主目录，
      # /uploads 静态路由（<exe 同级>/attachment）读取 product 落盘的附件
      - ./bin/attachment:/app/attachment
      # IP 定位数据库（GeoLite2-City）：由 download-geoip.mjs 下载更新（不入 git），
      # 目录未初始化时 IP 定位接口优雅降级，不影响其他功能
      - ./bin/data/geoip:/app/data/geoip:ro
      # 开发阶段挂载宿主机前端编译产物，避免每次修改都重新构建 gateway 镜像
      - ./bin/static/admin:/app/static/admin:ro
      - ./bin/static/h5:/app/static/h5:ro
    command: >
      sh -c "[ -f /app/runtime/config.yaml ] || cp -f /app/config.yaml /app/runtime/config.yaml; CONFIG_FILE=/app/runtime/config.yaml ./gateway"

volumes:
  mysql_data:
  redis_data:
