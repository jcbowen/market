# CI 流水线：后端（vet/test/build/lint）+ 前端（admin/client 构建）+ tag 触发自动发布 Release
# Release 产物：linux/darwin/windows × amd64/arm64 共 6 平台包（tar.gz，Windows 为 zip），内含 6 个服务二进制 + 前端产物 + config.yaml；
# 镜像产物：allinone 一体化镜像（单容器全栈）+ market-app 应用镜像（多容器部署，单镜像多容器），
# 均为 linux amd64/arm64 双架构，GHCR + Docker Hub 双发
# 说明：后端 Go module 位于 src/backend，前端位于 src/admin 与 src/client
# Gitea Actions 与 GitHub Actions 语法兼容，本文件在 GitHub 与 Gitea（act_runner）上均可运行；
# 注意 checkout v5、setup-go v6、setup-node v5、golangci-lint-action v9、docker 三件套
# （setup-qemu/setup-buildx/login v4 起）与 artifact 两件套（upload v6+/download v7+）的
# Action 运行时均为 Node 24，要求 act_runner ≥ 2.327.1，Gitea 侧 runner 过旧需先升级；
# tag 发布步骤已做平台适配（API 域名差异见「创建 Release 并上传产物」步骤注释）
name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 go vet/test/build
    runs-on: ubuntu-latest
    # tag 推送仅触发 release 流水线，检查类 job 跳过（release-test 内含 go test 回归）
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    # 集成测试依赖：MySQL/Redis 以 service 容器提供，端口映射到 runner 宿主 127.0.0.1。
    # 支付与调度器测试以 TEST_MYSQL_PASSWORD 为守卫，此前 CI 不设该变量导致
    # 资金链路用例恒 skip（假绿），现由下方 env 真正启用；测试库表由用例自行 AutoMigrate
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-mysql
          MYSQL_DATABASE: market
          # 库容器时区与生产（MySQL 容器 TZ=Asia/Shanghai）及测试进程对齐：
          # 库里 NOW() 与 Go 侧按进程时区写入的时间串比较（券过期、对账时间窗）
          # 必须同一口径，否则整体偏移 8 小时。时钟一致性由
          # services/product/service/db_clock_test.go 显式守卫并打印取证字段
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-mysql"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: '3306'
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: ci-mysql
      TEST_MYSQL_DBNAME: market
      TEST_REDIS_ADDR: 127.0.0.1:6379
      # 测试进程时区与生产（容器 TZ=Asia/Shanghai）对齐：DSN parseTime=True 下
      # driver 读回的 time.Time 挂进程时区，「读回实体再 Save 全量写回」经 RFC3339
      # 转换时 UTC 会产生 MySQL DATETIME 不接受的 Z 后缀（Error 1292），+08:00 偏移则可被接受
      TZ: Asia/Shanghai
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: src/backend/go.sum

      # jcbaseGo / wego / alipay-sdk-go-all 已在 GitHub 公开发布对应 tag，
      # 本地开发经 go.mod replace 指向本机仓库目录；
      # CI 统一 drop replace，从公共 Go proxy 拉取已发布版本。
      # 新增本地 replace 依赖时必须同步在此处补 dropreplace，否则 CI 上不存在
      # ../../../ 仓库外路径，go mod tidy 会直接报 replacement directory does not exist。
      # 注意：若本地依赖库有未发版改动导致编译不兼容，需先在依赖仓库发布新 tag
      # 并同步更新本仓库 go.mod require 版本；或改用 PAT + GOPRIVATE 私有拉取方案。
      - name: 移除本地 replace 指令
        run: |
          go mod edit -dropreplace github.com/jcbowen/jcbaseGo
          go mod edit -dropreplace github.com/jcbowen/wego
          go mod edit -dropreplace github.com/jcbowen/alipay-sdk-go-all

      - name: 下载依赖
        run: go mod tidy

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: go build
        run: go build ./...

  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    # 2026-10-25 本地以与 CI 同版本 v2.14 全量跑 0 issues，改为阻断模式（收紧 linter 前先保持最小集）
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: src/backend/go.sum

      # 与 backend job 一致：drop 本地 replace 后从公共 Go proxy 拉取已发布版本，
      # 否则 CI 上不存在 ../../../jcbaseGo 本地目录，typecheck 直接报错
      - name: 移除本地 replace 指令
        working-directory: src/backend
        run: |
          go mod edit -dropreplace github.com/jcbowen/jcbaseGo
          go mod edit -dropreplace github.com/jcbowen/wego
          go mod edit -dropreplace github.com/jcbowen/alipay-sdk-go-all

      # 仓库提交的 go.sum 基于 replace 状态生成，不含 jcbaseGo/wego 条目，
      # 需 tidy 补全后 lint 才能完成 typecheck
      - name: 下载依赖
        working-directory: src/backend
        run: go mod tidy

      # 配置文件位于仓库根目录 .golangci.yml（v2 格式），golangci-lint 会自
      # working-directory 逐级向上查找配置
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: src/backend

  admin-build:
    name: 后台管理前端构建
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    defaults:
      run:
        working-directory: src/admin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/admin/package-lock.json

      - name: 安装依赖
        run: |
          for i in 1 2 3; do
            if npm ci; then break; fi
            echo "npm ci 第 ${i} 次失败（多为网络抖动），10s 后重试"
            if [[ ${i} -eq 3 ]]; then exit 1; fi
            sleep 10
          done

      - name: 构建（含 vue-tsc 类型检查）
        run: npm run build

  client-build:
    name: 用户端 H5 构建
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: 安装依赖
        run: |
          for i in 1 2 3; do
            if npm ci; then break; fi
            echo "npm ci 第 ${i} 次失败（多为网络抖动），10s 后重试"
            if [[ ${i} -eq 3 ]]; then exit 1; fi
            sleep 10
          done

      - name: 构建 H5
        run: npm run build:h5

  # ================= tag 发布流水线（并行化，2026-10-23 改造） =================
  # 依赖关系与墙钟时间：
  #   release-test（回归）──> release-backend（matrix 6 平台并行编译）──┐
  #   release-frontend（管理端 + H5，独立并行）──────────────────────┼──> release-image（多架构镜像：
  #   release-base（按 Dockerfile.base 内容哈希按需构建基础镜像）─────┘     allinone 一体化 + app 多容器两份）
  #   release-backend + release-frontend ──> release-packages（Release 压缩包）
  # 各 job 产物经 upload/download-artifact 传递（无共享文件系统）；
  # 慢的 apt/QEMU 仅存在于 release-base（低频触发），镜像构建降为秒级 COPY。
  # 预发布 tag（含 '-'，如 v0.4.0-test / v1.0.0-rc.1）：镜像不打 :latest、Release 标 prerelease。

  release-test:
    name: 发布前回归测试
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-mysql
          MYSQL_DATABASE: market
          # 库容器时区与生产（MySQL 容器 TZ=Asia/Shanghai）及测试进程对齐：
          # 库里 NOW() 与 Go 侧按进程时区写入的时间串比较（券过期、对账时间窗）
          # 必须同一口径，否则整体偏移 8 小时。时钟一致性由
          # services/product/service/db_clock_test.go 显式守卫并打印取证字段
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-mysql"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: '3306'
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: ci-mysql
      TEST_MYSQL_DBNAME: market
      TEST_REDIS_ADDR: 127.0.0.1:6379
      # 与 backend job 同理：进程时区对齐生产，避免 RFC3339 Z 后缀写回 DATETIME 报 Error 1292
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: src/backend/go.sum

      # 与 backend job 一致：drop 本地 replace 后从公共 Go proxy 拉取已发布版本
      - name: 移除本地 replace 指令
        working-directory: src/backend
        run: |
          go mod edit -dropreplace github.com/jcbowen/jcbaseGo
          go mod edit -dropreplace github.com/jcbowen/wego
          go mod edit -dropreplace github.com/jcbowen/alipay-sdk-go-all

      - name: 下载依赖
        working-directory: src/backend
        run: go mod tidy

      - name: 发布前回归测试
        working-directory: src/backend
        run: go test ./... -count=1

  release-backend:
    name: 交叉编译 ${{ matrix.platform }}
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-test
    permissions:
      contents: read
    # 按平台拆 matrix：6 个 job 并行，每个 job 只编译自己平台的 8 个产物
    #（换 GOOS/GOARCH 后 Go 编译缓存全 miss，串行时每平台都要全量重编一遍）
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-amd64, goos: linux, arch: amd64, ext: '' }
          - { platform: linux-arm64, goos: linux, arch: arm64, ext: '' }
          - { platform: darwin-amd64, goos: darwin, arch: amd64, ext: '' }
          - { platform: darwin-arm64, goos: darwin, arch: arm64, ext: '' }
          - { platform: windows-amd64, goos: windows, arch: amd64, ext: '.exe' }
          - { platform: windows-arm64, goos: windows, arch: arm64, ext: '.exe' }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: src/backend/go.sum

      - name: 移除本地 replace 指令
        working-directory: src/backend
        run: |
          go mod edit -dropreplace github.com/jcbowen/jcbaseGo
          go mod edit -dropreplace github.com/jcbowen/wego
          go mod edit -dropreplace github.com/jcbowen/alipay-sdk-go-all

      - name: 下载依赖
        working-directory: src/backend
        run: go mod tidy

      # 平台内 8 个产物 xargs -P4 并行：共享同一份编译缓存，gateway 已缓存依赖
      # 后其余构建很快；版本号经 -ldflags 注入 common/version.AppVersion
      - name: 并行编译 8 个产物
        working-directory: src/backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
          OUT_DIR: ../../bin/${{ matrix.platform }}
          LDFLAGS: -X github.com/jcbowen/market/src/backend/common/version.AppVersion=${{ github.ref_name }}
        run: |
          printf '%s\n' \
            "gateway|gateway" \
            "services/user|user-service" \
            "services/product|product-service" \
            "services/order|order-service" \
            "services/cart|cart-service" \
            "services/payment|payment-service" \
            "cmd/market-admin|market-admin" \
            "cmd/geoip-download|geoip-download" \
          | xargs -P 4 -I{} bash -c '
            item="{}"; svc="${item%%|*}"; name="${item##*|}"
            CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o "${OUT_DIR}/${name}${EXT}" "./${svc}/"
          '
          ls -lh "${OUT_DIR}"

      # 注意：path 单目录会被 v4 剥掉目录名层（root=目录内容）。matrix job 的 bin/ 下
      # 只有本平台一个目录，上传 `bin` 使 artifact 根=bin 内容（即 linux-amd64/...），
      # merge 下载到 bin/ 后恰好恢复 bin/<platform>/ 结构
      # retention-days=1：artifact 仅为流水线内部传递用，下游消费完即无用；
      # 私有仓库 Actions 存储免费额度仅 500MB，默认 90 天保留会撑爆配额，
      # 设 1 天兜底（正常路径发布完即删，见 release-packages 的清理步骤）
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.platform }}
          path: bin
          retention-days: 1

  release-frontend:
    name: 前端构建（admin + H5）
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/admin/package-lock.json
            src/client/package-lock.json

      # 两个前端构建均直接输出到项目根 bin/static/ 下（vite outDir / build-h5.js 后处理）
      - name: 构建管理端前端
        working-directory: src/admin
        run: |
          for i in 1 2 3; do
            if npm ci; then break; fi
            echo "npm ci 第 ${i} 次失败（多为网络抖动），10s 后重试"
            if [[ ${i} -eq 3 ]]; then exit 1; fi
            sleep 10
          done
          npm run build

      - name: 构建 C 端 H5
        working-directory: src/client
        run: |
          for i in 1 2 3; do
            if npm ci; then break; fi
            echo "npm ci 第 ${i} 次失败（多为网络抖动），10s 后重试"
            if [[ ${i} -eq 3 ]]; then exit 1; fi
            sleep 10
          done
          npm run build:h5

      # 同上：单目录 path 剥掉目录名层。前端 job 的 bin/ 下只有 static/，
      # 上传 `bin` → artifact 根=static/admin、static/h5 → merge 后恢复 bin/static/
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: bin-static
          path: bin
          retention-days: 1

  release-base:
    name: 基础镜像（按需构建）
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-test]
    permissions:
      contents: read
      packages: write
    outputs:
      # 只传哈希 tag（不含 DOCKERHUB_USERNAME）：GitHub 会静默丢弃含 secret
      # 值的 job output（"Skip output ... since it may contain secret"），
      # 完整镜像名由 release-image 用自己的 secrets 重组
      base_tag: ${{ steps.base.outputs.base_tag }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # 检测规则：tag = Dockerfile.base 内容 sha256 前 12 位。
      # 内容未变 → 仓库里已有同 tag → 秒过；内容变了 → 新 tag 不存在 → 构建推送。
      # base 镜像是 release-image 的 FROM 依赖，发布到 Docker Hub（国内生产机可达），
      # 因此 DOCKERHUB secrets 为发布流水线硬性前置；GHCR 为双发冗余副本。
      - name: 计算内容哈希并检测是否已发布
        id: base
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "错误：base 镜像发布到 Docker Hub，请先在仓库 Secrets 配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN"
            exit 1
          fi
          BASE_TAG="sha-$(sha256sum src/backend/deploy/Dockerfile.base | cut -c1-12)"
          BASE_IMAGE="docker.io/${DOCKERHUB_USERNAME}/market-base:${BASE_TAG}"
          BASE_LATEST="docker.io/${DOCKERHUB_USERNAME}/market-base:latest"
          # GHCR 双发（与 release-image 的 GHCR 命名口径一致：<repo> + "-base" 后缀）
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-base"
          echo "base_tag=${BASE_TAG}" >> "$GITHUB_OUTPUT"
          # BASE_TAG 经 GITHUB_ENV 传给后续构建步骤（普通 shell 变量跨步骤不保留，
          # 首跑曾因缺失导致 invalid tag "ghcr.io/.../market-base:"）
          echo "BASE_TAG=${BASE_TAG}" >> "$GITHUB_ENV"
          echo "BASE_IMAGE=${BASE_IMAGE}" >> "$GITHUB_ENV"
          echo "BASE_LATEST=${BASE_LATEST}" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=${GHCR_IMAGE}" >> "$GITHUB_ENV"
          # 注意：market-base 为公开仓库，匿名 manifest 检测可用；若改为私有需先 docker login
          if docker manifest inspect "${BASE_IMAGE}" > /dev/null 2>&1; then
            echo "基础镜像已存在，跳过构建：${BASE_IMAGE}"
            echo "need_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "基础镜像不存在，将构建：${BASE_IMAGE}"
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          fi

      # 以下步骤仅 base 缺失时执行（apt + arm64 QEMU 的 5~10 分钟只发生在改过
      # Dockerfile.base 的那次发版）
      - name: 设置 QEMU（多架构构建）
        if: steps.base.outputs.need_build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: 设置 Buildx
        if: steps.base.outputs.need_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        if: steps.base.outputs.need_build == 'true'
        run: echo "${DOCKERHUB_TOKEN}" | docker login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: 登录 GHCR
        if: steps.base.outputs.need_build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送多架构基础镜像
        if: steps.base.outputs.need_build == 'true'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f src/backend/deploy/Dockerfile.base \
            -t "${BASE_IMAGE}" \
            -t "${BASE_LATEST}" \
            -t "${GHCR_IMAGE}:${BASE_TAG}" \
            -t "${GHCR_IMAGE}:latest" \
            --push .

  release-image:
    name: 多架构镜像（allinone + app）
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-backend, release-frontend, release-base]
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # 汇合各 matrix 平台与前端产物：merge-multiple 合并下载到 bin/，
      # 恢复出与原单 job 布局一致的 bin/linux-* 与 bin/static
      - name: 下载全部产物
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: bin
          merge-multiple: true

      - name: 产物完整性校验
        run: |
          ls -la bin/
          test -f bin/linux-amd64/gateway
          test -f bin/linux-amd64/payment-service
          test -f bin/linux-arm64/gateway
          test -f bin/linux-arm64/market-admin
          test -d bin/static/admin
          test -d bin/static/h5
          test -f bin/config.allinone.yaml
          # app 镜像（多容器部署）依赖的配置模板与入口脚本（后者随 checkout 提供）
          test -f bin/config.docker.yaml
          test -f src/backend/deploy/entrypoint-app.sh
          # 演示种子素材与导入脚本随镜像打包（三个 Dockerfile 的 COPY deploy/seed-assets/products），
          # 缺文件会让 /uploads/seed/** 全 404、stage 环境无演示数据，故与二进制同批校验
          test -f deploy/init.dev.sql
          test -f deploy/seed-assets/images.json
          test -f deploy/seed-assets/products/latiao.png
          test -f src/backend/deploy/seed-init.sh
          chmod +x bin/linux-amd64/* bin/linux-arm64/*

      # FROM market-base（apt 层已固化）仅 COPY 无需 QEMU；但 app 镜像基于
      # alpine 且有 RUN apk 步骤，arm64 侧需 QEMU 模拟执行
      - name: 设置 QEMU（app 镜像 arm64 构建）
        uses: docker/setup-qemu-action@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub 双发（国内生产机可达）；release-base 已强制配置 secrets
      - name: 登录 Docker Hub
        run: echo "${DOCKERHUB_TOKEN}" | docker login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: 构建并推送多架构一体化镜像
        env:
          BASE_TAG: ${{ needs.release-base.outputs.base_tag }}
        run: |
          # base 完整镜像名在此重组：job output 不能携带 secret（DOCKERHUB_USERNAME），
          # 否则被 GitHub 整体丢弃（首跑曾因此拿到空 BASE_IMAGE）
          BASE_IMAGE="docker.io/${DOCKERHUB_USERNAME}/market-base:${BASE_TAG}"
          echo "使用基础镜像：${BASE_IMAGE}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          # 预发布 tag（semver 含 '-'，如 v0.4.0-test / v1.0.0-rc.1）不打 latest：
          # 避免测试版本覆盖 :latest，导致生产机 docker compose pull 拉到 test 版
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "预发布 tag：不打 :latest，仅推 ${GITHUB_REF_NAME}"
            TAGS="-t ${IMAGE}:${GITHUB_REF_NAME}"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              TAGS="$TAGS -t docker.io/${DOCKERHUB_USERNAME}/market:${GITHUB_REF_NAME}"
            fi
          else
            TAGS="-t ${IMAGE}:${GITHUB_REF_NAME} -t ${IMAGE}:latest"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              TAGS="$TAGS -t docker.io/${DOCKERHUB_USERNAME}/market:${GITHUB_REF_NAME} -t docker.io/${DOCKERHUB_USERNAME}/market:latest"
            fi
          fi
          # 构建缓存改存 registry（与镜像同仓库，不再受 GHA 缓存 10GB 上限约束；
          # base 拆分后剩余层很小，此缓存仅为加速重复产物层上传）
          CACHE_ARGS=""
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            CACHE_ARGS="--cache-from type=registry,ref=docker.io/${DOCKERHUB_USERNAME}/market:buildcache --cache-to type=registry,mode=max,ref=docker.io/${DOCKERHUB_USERNAME}/market:buildcache"
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f src/backend/deploy/Dockerfile.allinone \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            ${TAGS} \
            ${CACHE_ARGS} \
            --push .

      # 多容器部署应用镜像（单镜像多容器，alpine 底座不含 MySQL/Redis，
      # 见 src/backend/deploy/Dockerfile.app 与 docker-compose.prod.yml）。
      # 与 allinone 消费同一份 bin/ 产物；tag/预发布/latest 口径与上方一致
      - name: 构建并推送多架构应用镜像
        env:
          BASE_TAG: ${{ needs.release-base.outputs.base_tag }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-app"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "预发布 tag：不打 :latest，仅推 ${GITHUB_REF_NAME}"
            TAGS="-t ${IMAGE}:${GITHUB_REF_NAME}"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              TAGS="$TAGS -t docker.io/${DOCKERHUB_USERNAME}/market-app:${GITHUB_REF_NAME}"
            fi
          else
            TAGS="-t ${IMAGE}:${GITHUB_REF_NAME} -t ${IMAGE}:latest"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              TAGS="$TAGS -t docker.io/${DOCKERHUB_USERNAME}/market-app:${GITHUB_REF_NAME} -t docker.io/${DOCKERHUB_USERNAME}/market-app:latest"
            fi
          fi
          CACHE_ARGS=""
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            CACHE_ARGS="--cache-from type=registry,ref=docker.io/${DOCKERHUB_USERNAME}/market-app:buildcache --cache-to type=registry,mode=max,ref=docker.io/${DOCKERHUB_USERNAME}/market-app:buildcache"
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f src/backend/deploy/Dockerfile.app \
            ${TAGS} \
            ${CACHE_ARGS} \
            --push .

  release-packages:
    name: 打包 Release 并发布
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-backend, release-frontend]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: 下载全部产物
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: bin
          merge-multiple: true

      - name: 产物完整性校验
        run: |
          # 先断言后 chmod：断言失败时保留完整目录信息便于定位
          ls -la bin/
          test -f bin/windows-amd64/gateway.exe
          test -f bin/linux-amd64/gateway
          test -d bin/static/admin
          test -d bin/static/h5
          test -f bin/config.yaml
          # 种子素材随发布包分发（打包步骤 cp 到 <包根>/seed），缺失即种子商品图 404
          test -f deploy/seed-assets/products/latiao.png
          chmod +x bin/linux-*/* bin/darwin-*/*

      # 打包：解压后得到 market-{ver}-{os}-{arch}/ 目录，布局对齐部署文档 9.3.5 的 /opt/market；
      # linux/darwin 打 tar.gz，windows 打 zip（ubuntu runner 自带 zip 命令）
      - name: 打包 Release 产物
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p package
          for dir in bin/linux-* bin/darwin-* bin/windows-*; do
            name="${dir#bin/}"
            stage="market-${VERSION}-${name}"
            rm -rf "package/${stage}" && mkdir -p "package/${stage}/static"
            cp "${dir}"/* "package/${stage}/"
            cp bin/config.yaml "package/${stage}/config.yaml"
            cp -r bin/static/admin "package/${stage}/static/admin"
            cp -r bin/static/h5 "package/${stage}/static/h5"
            # 演示种子素材：发布包内 gateway 以 <包根>/seed 作为 /uploads/seed/** 的根目录，
            # 不带这份素材时种子商品图全 404（来源与镜像一致，均为 deploy/seed-assets/products）
            mkdir -p "package/${stage}/seed"
            cp -r deploy/seed-assets/products "package/${stage}/seed/products"
            case "$name" in
              windows-*) zip -qr "package/${stage}.zip" "package/${stage}" ;;
              *)         tar -czf "package/${stage}.tar.gz" -C package "${stage}" ;;
            esac
          done
          ls -lh package/*.tar.gz package/*.zip

      # 通过平台 API 发布（GitHub / Gitea 双端兼容）：内置 GITHUB_TOKEN（Gitea 等价 GITEA_TOKEN），无需第三方 action
      - name: 创建 Release 并上传产物
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 平台适配：github.com 的 API 与资产上传分属两个域名，Gitea 为单域名 /api/v1
          if [[ "${GITHUB_SERVER_URL}" == *github.com* ]]; then
            API="https://api.github.com"
            UPLOAD_API="https://uploads.github.com"
          else
            API="${GITHUB_SERVER_URL%/}/api/v1"
            UPLOAD_API="${API}"
          fi
          VERSION="${GITHUB_REF_NAME}"
          AUTH="Authorization: token ${GITHUB_TOKEN}"
          REPO="repos/${GITHUB_REPOSITORY}"

          # 预发布 tag（semver 含 '-'，如 v0.4.0-test）在 Release 页标记为 prerelease，
          # GitHub/Gitea API 均支持该字段，不进正式版本列表
          PRE_FLAG="false"
          if [[ "${VERSION}" == *-* ]]; then PRE_FLAG="true"; fi

          # 创建 Release；捕获响应体以便失败时从日志定位（如 token 权限、重复 tag）
          CREATE_RESP=$(curl -sS -X POST "${API}/${REPO}/releases" \
            -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${VERSION}\",\"name\":\"${VERSION}\",\"prerelease\":${PRE_FLAG},\"body\":\"自动发布：${VERSION}\"}") || true
          RELEASE_ID=$(echo "${CREATE_RESP}" | grep -o '"id": *[0-9]*' | head -1 | grep -o '[0-9]*' || true)

          # 该 tag 已有 Release（重复触发）时改为获取并复用
          if [ -z "${RELEASE_ID}" ]; then
            GET_RESP=$(curl -sS "${API}/${REPO}/releases/tags/${VERSION}" -H "$AUTH") || true
            RELEASE_ID=$(echo "${GET_RESP}" | grep -o '"id": *[0-9]*' | head -1 | grep -o '[0-9]*' || true)
          fi
          if [ -z "${RELEASE_ID}" ]; then
            echo "获取 Release ID 失败，创建响应：${CREATE_RESP}"
            exit 1
          fi
          echo "Release ID: ${RELEASE_ID}"

          # 幂等保护：重跑或部分成功后重试时，同名资产已存在会返回 422，先查列表跳过
          EXISTING_ASSETS=$(curl -sS "${API}/${REPO}/releases/${RELEASE_ID}/assets?per_page=100" -H "$AUTH") || true
          for f in package/*.tar.gz package/*.zip; do
            name=$(basename "${f}")
            if echo "${EXISTING_ASSETS}" | grep -q "\"name\": *\"${name}\""; then
              echo "资产 ${name} 已存在，跳过"
              continue
            fi
            echo "上传 ${name} ..."
            if [[ "${GITHUB_SERVER_URL}" == *github.com* ]]; then
              # GitHub 资产上传只接受 raw binary（文档要求 application/octet-stream），
              # multipart 的 attachment 字段是 Gitea 写法，GitHub 端会校验失败
              RESP_CODE=$(curl -sS -o /tmp/upload_resp -w "%{http_code}" \
                -X POST "${UPLOAD_API}/${REPO}/releases/${RELEASE_ID}/assets?name=${name}" \
                -H "$AUTH" -H "Content-Type: application/octet-stream" \
                --data-binary "@${f}") || RESP_CODE="000"
            else
              RESP_CODE=$(curl -sS -o /tmp/upload_resp -w "%{http_code}" \
                -X POST "${UPLOAD_API}/${REPO}/releases/${RELEASE_ID}/assets?name=${name}" \
                -H "$AUTH" -F "attachment=@${f}") || RESP_CODE="000"
            fi
            # 成功状态码两端一致均为 201；失败时打印响应体便于定位（如 422 already_exists）
            if [[ "${RESP_CODE}" != "201" ]]; then
              echo "上传 ${name} 失败（HTTP ${RESP_CODE}），响应体："
              cat /tmp/upload_resp || true
              exit 1
            fi
            echo "上传完成：${name}"
          done
          echo "发布完成：${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}/releases/tag/${VERSION}"

  # ================= artifact 清理（2026-10-26 新增，压 Actions 存储配额） =================
  # release-backend/release-frontend 上传的 bin-* artifact 仅作 job 间传递，发布完成后即无用。
  # 私有仓库 Actions 存储免费额度 500MB，单次发版 artifact 体量为 GB 级（6 平台二进制包+前端），
  # 默认保留 90 天必然撑爆配额，故发布完成后立即删除；
  # 流水线中断遗留的由 upload-artifact 的 retention-days: 1 兜底次日清理。
  # cleanup 单独成 job 且始终执行（含 release-packages 失败时），不依赖发布成败
  cleanup-artifacts:
    name: 清理传递用 artifact
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [release-backend, release-frontend, release-packages]
    permissions:
      actions: write
    steps:
      - name: 删除本次运行的 artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub 与 Gitea API 域名差异同「创建 Release」步骤；Gitea 不支持 artifacts
          # API 时列出为空/请求失败，脚本静默跳过，不影响任何已完成的发布结果
          if [[ "${GITHUB_SERVER_URL}" == *github.com* ]]; then
            API="https://api.github.com"
          else
            API="${GITHUB_SERVER_URL%/}/api/v1"
          fi
          AUTH="Authorization: token ${GITHUB_TOKEN}"
          RUN_ARTIFACTS_URL="${API}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100"
          RESP=$(curl -sS "${RUN_ARTIFACTS_URL}" -H "$AUTH") || true
          COUNT=$(echo "${RESP}" | grep -o '"total_count": *[0-9]*' | head -1 | grep -o '[0-9]*' || echo 0)
          echo "本次运行 artifact 数量：${COUNT:-0}"
          # 仅提取 artifact 条目的 "id" 字段逐个删除；删除失败不阻断（job 无发布依赖）
          echo "${RESP}" | grep -o '"id": *[0-9]*' | grep -o '[0-9]*' | while read -r id; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
              "${API}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" -H "$AUTH") || CODE="000"
            echo "删除 artifact ${id}：HTTP ${CODE}"
          done
