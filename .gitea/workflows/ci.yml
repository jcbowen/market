# Gitea 日常检查流水线（push main / PR）。与 .github/workflows/ci.yml 分工：
#   - 本文件：日常检查（后端 vet/test/build、管理端与 H5 构建），只在推送与 PR 时跑；
#   - .github/workflows/ci.yml：tag 发布（6 平台产物 + 双架构镜像 + Release），只在 GitHub 跑。
# 本文件**不得**出现 tag 触发：同一 tag 两端各发一次 Release 会附件互踩、:latest 指向漂移。
#
# 与 GitHub 版本的 5 处环境差异（均为 NAS 环境所迫，改动前先读）：
#   1. services 不映射宿主端口：宿主 3306 已被 mysql-1 占用，job 与 service 同网络，
#      直接用服务名（mysql / redis）访问；
#   2. services 不声明 healthcheck：runner 的 service_ready_timeout 到点会直接判 job 失败
#      （默认 5m，NAS 侧调成 10m 也被 2026-10-26 的一次运行撞穿），且该配置项放错缩进会被
#      静默忽略。改为 job 内的 wait_tcp 显式轮询 MySQL/Redis 端口：预算 20 分钟、
#      每 60 秒打一次进度，失败时 dump 服务容器的 docker 状态与日志（job 容器挂着宿主 docker.sock）；
#   3. setup-go 锁精确版本 1.26.5：指定 go-download-base-url 后会跳过版本清单，
#      别名写法（如 '1.26'）在该模式下解析不了；
#   4. 前端不用 actions/setup-node，改 curl 直下 Node tarball（npmmirror CDN）：
#      该 action 的 mirror 输入只作用于「回退直连」分支，主路径的下载 URL 来自
#      actions/node-versions 清单、硬编码指向 github.com releases，NAS 出不去必 ETIMEDOUT；
#      回退分支又要 GET ${mirror}/index.json，而 npmmirror 的 /mirrors/node 对 index.json
#      返回 302 到 cdn 域，action 的 getJson 不跟随重定向 → 空列表 →
#      "Unable to find Node version '22'"。直下可绕开整条链路；
#      npm 依赖本身由 lockfile 的 mirrors.tencent.com 提供，无需额外配置；
#   5. golangci 用 install-mode: goinstall：默认 binary 模式要从 github.com releases
#      下预编译 tar.gz，runner.github_mirror 只代理 action 仓库、不覆盖 action 运行时的下载。
#      goinstall 模式的代价是每次 job 现场编译 1–2 分钟，且该模式硬编码 CGO_ENABLED=1，需要 gcc。
#
# 前置（runner config.yaml）：
#   - runner.envs 注入 GOPROXY / npm_config_registry（本文件在 job env 再显式声明一份兜底）
#   - container.service_ready_timeout 已不影响本文件（services 无 healthcheck）；
#     job 容器需要能拿到宿主 docker.sock 才能在失败时 dump 服务容器日志（runner 默认自动挂）
#
# 首次运行重点观察：MySQL 冷启动耗时（wait_tcp 会打印）、
# setup-go 是否命中 golang.google.cn 与缓存、golangci 的现场编译耗时与 gcc 是否就位、
# 前端 Node 直下的用时。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 go vet/test/build
    runs-on: ubuntu-latest
    # 20 分钟等 MySQL + 完整测试与构建，留足余量（runner 侧的 service_ready_timeout 不再参与）
    timeout-minutes: 60
    # 集成测试依赖：MySQL/Redis 以 service 容器提供，与 job 同网络，
    # 通过服务名访问（不映射宿主端口，宿主 3306 已被 mysql-1 占用）。
    # 不写 options/healthcheck：MySQL 初始化阶段只开 socket 不开 3306，
    # 用 mysqladmin + TCP 探活才能真正反映「可连接」；就绪判定统一交给下面的 wait_tcp。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-mysql
          MYSQL_DATABASE: market
          # 库容器时区与生产（MySQL 容器 TZ=Asia/Shanghai）及测试进程对齐：
          # 库里 NOW() 与 Go 侧按进程时区写入的时间串比较（券过期、对账时间窗）
          # 必须同一口径，否则整体偏移 8 小时。时钟一致性由
          # services/product/service/db_clock_test.go 显式守卫并打印取证字段
          TZ: Asia/Shanghai
      redis:
        image: redis:7-alpine
    env:
      TEST_MYSQL_HOST: mysql
      TEST_MYSQL_PORT: '3306'
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: ci-mysql
      TEST_MYSQL_DBNAME: market
      TEST_REDIS_ADDR: redis:6379
      # 测试进程时区与生产（容器 TZ=Asia/Shanghai）对齐，DSN parseTime=True 下
      # driver 读回的 time.Time 挂进程时区，「读回实体再 Save 全量写回」经 RFC3339
      # 转换时 UTC 会产生 MySQL DATETIME 不接受的 Z 后缀（Error 1292），+08:00 偏移则可被接受
      TZ: Asia/Shanghai
      # runner 已全局注入同一组值，此处显式声明避免依赖 runner 配置
      GOPROXY: https://goproxy.cn,direct
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # 必须写精确补丁号：设置 go-download-base-url 后不再读取版本清单
          go-version: '1.26.5'
          go-download-base-url: https://golang.google.cn/dl
          cache-dependency-path: src/backend/go.sum

      # jcbaseGo / wego / alipay-sdk-go-all 已在 GitHub 公开发布对应 tag，
      # 本地开发经 go.mod replace 指向本机仓库目录；
      # CI 统一 drop replace，从公共 Go proxy 拉取已发布版本。
      # 新增本地 replace 依赖时必须同步在此处补 dropreplace，否则 CI 上不存在
      # ../../../ 仓库外路径，go mod tidy 会直接报 replacement directory does not exist。
      - name: 移除本地 replace 指令
        run: |
          go mod edit -dropreplace github.com/jcbowen/jcbaseGo
          go mod edit -dropreplace github.com/jcbowen/wego
          go mod edit -dropreplace github.com/jcbowen/alipay-sdk-go-all

      - name: 下载依赖
        run: go mod tidy

      # services 没有 healthcheck，runner 不会等；就绪与否全看这里。
      # MySQL 初始化阶段只监听 socket、不开 3306，所以 TCP 能连上就等于「初始化已完成」。
      # NAS 上冷启动波动很大（实测 325s，2026-10-26 有一次 10 分钟仍未就绪），预算给 20 分钟；
      # 失败时把服务容器的 docker 状态与日志打进 job 日志：job 容器挂着宿主 docker.sock，
      # 足以区分「初始化太慢」「容器崩了」「OOMKilled」三种情况，不必再去 NAS 上翻。
      - name: 等待 MySQL / Redis 可达
        run: |
          dump_service_logs() {
            local pattern=$1 label=$2 ids id
            if ! command -v docker >/dev/null 2>&1; then
              echo "（job 容器内无 docker CLI，跳过 ${label} 容器日志）"
              return 0
            fi
            ids=$(docker ps -a --format '{{.ID}}|{{.Image}}|{{.Status}}' | grep -i "$pattern" | cut -d'|' -f1 || true)
            if [ -z "$ids" ]; then
              echo "（未找到镜像名含 ${pattern} 的容器，可能已被 runner 清理）"
              return 0
            fi
            for id in $ids; do
              echo "----- ${label} 容器 ${id} -----"
              docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}}' "$id" 2>&1 || true
              docker logs --tail 100 "$id" 2>&1 || true
            done
          }

          wait_tcp() {
            local host=$1 port=$2 label=$3 pattern=$4 start i
            start=$(date +%s)
            for i in $(seq 1 120); do
              if timeout 2 bash -c "cat < /dev/null > /dev/tcp/${host}/${port}" 2>/dev/null; then
                echo "OK   ${label} 可连接，耗时 $(( $(date +%s) - start ))s"
                return 0
              fi
              if [ $(( i % 6 )) -eq 0 ]; then
                echo "WAIT ${label} 尚未就绪，已等 $(( $(date +%s) - start ))s"
              fi
              sleep 10
            done
            echo "FAIL ${label} 20 分钟内 ${host}:${port} 不可达"
            dump_service_logs "$pattern" "$label"
            return 1
          }

          fail=0
          # 用精确镜像名匹配，避免把宿主上同类容器（如 mysql-1 的 5.7）的日志混进来
          wait_tcp mysql 3306 MySQL 'mysql:8.0' || fail=1
          wait_tcp redis 6379 Redis 'redis:7-alpine' || fail=1
          exit $fail

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: go build
        run: go build ./...

  golangci:
    name: 代码静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          go-download-base-url: https://golang.google.cn/dl
          cache-dependency-path: src/backend/go.sum

      # goinstall 模式在 action 源码里硬编码 CGO_ENABLED=1（src/install.ts），
      # 没有 C 编译器会直接失败；镜像自带就跳过，省一次 apt
      - name: 确保 C 工具链
        run: |
          if command -v gcc >/dev/null 2>&1; then
            echo "OK   gcc 已就绪：$(gcc --version | head -1)"
            exit 0
          fi
          echo "gcc 缺失，安装 build-essential ..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential

      # 与 backend job 一致：drop 本地 replace 后从公共 Go proxy 拉取已发布版本，
      # 否则 CI 上不存在 ../../../jcbaseGo 本地目录，typecheck 直接报错
      - name: 移除本地 replace 指令
        working-directory: src/backend
        run: |
          go mod edit -dropreplace github.com/jcbowen/jcbaseGo
          go mod edit -dropreplace github.com/jcbowen/wego
          go mod edit -dropreplace github.com/jcbowen/alipay-sdk-go-all

      # 仓库提交的 go.sum 基于 replace 状态生成，不含 jcbaseGo/wego 条目，
      # 需 tidy 补全后 lint 才能完成 typecheck
      - name: 下载依赖
        working-directory: src/backend
        run: go mod tidy

      # goinstall 模式让 action 执行 go install（走 goproxy.cn），
      # 不碰 github.com releases；该模式下 version 原样透传给 go install，
      # 故写全补丁号，避免前缀查询带来的解析歧义。
      # 配置文件位于仓库根目录 .golangci.yml（v2 格式），action 会自 working-directory 逐级向上查找
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-mode: goinstall
          working-directory: src/backend

  admin-build:
    name: 后台管理前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/admin
    steps:
      - uses: actions/checkout@v5

      # setup-node 在本环境不可用（原因见文件头第 4 条），直接拉官方 tarball。
      # 代价：没有 setup-node 的 npm 缓存，但本仓库 lockfile 的 resolved 指向
      # mirrors.tencent.com，npm ci 本身够快。升级 Node 时只改 env.NODE_VERSION，
      # 可用版本见 https://cdn.npmmirror.com/binaries/node/index.json
      - name: 安装 Node（npmmirror 直下）
        env:
          NODE_VERSION: 22.23.4
        run: |
          case "$(uname -m)" in
            x86_64) NODE_ARCH=x64 ;;
            aarch64|arm64) NODE_ARCH=arm64 ;;
            *) echo "不支持的架构：$(uname -m)"; exit 1 ;;
          esac
          node_dir="$HOME/.local/node-v${NODE_VERSION}-linux-${NODE_ARCH}"
          url="https://cdn.npmmirror.com/binaries/node/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.gz"
          echo "下载 ${url}"
          curl -fsSL -L --retry 3 --retry-delay 5 -o /tmp/node.tar.gz "$url"
          mkdir -p "${node_dir}"
          tar -xzf /tmp/node.tar.gz -C "${node_dir}" --strip-components=1
          export PATH="${node_dir}/bin:$PATH"
          node --version
          npm --version
          echo "${node_dir}/bin" >> "$GITHUB_PATH"

      - name: 安装依赖
        env:
          npm_config_registry: https://registry.npmmirror.com
        run: |
          for i in 1 2 3; do
            if npm ci; then break; fi
            echo "npm ci 第 ${i} 次失败（多为网络抖动），10s 后重试"
            if [[ ${i} -eq 3 ]]; then exit 1; fi
            sleep 10
          done

      - name: 构建（含 vue-tsc 类型检查）
        run: npm run build

  client-build:
    name: 用户端 H5 构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node（npmmirror 直下）
        env:
          NODE_VERSION: 22.23.4
        run: |
          case "$(uname -m)" in
            x86_64) NODE_ARCH=x64 ;;
            aarch64|arm64) NODE_ARCH=arm64 ;;
            *) echo "不支持的架构：$(uname -m)"; exit 1 ;;
          esac
          node_dir="$HOME/.local/node-v${NODE_VERSION}-linux-${NODE_ARCH}"
          url="https://cdn.npmmirror.com/binaries/node/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.gz"
          echo "下载 ${url}"
          curl -fsSL -L --retry 3 --retry-delay 5 -o /tmp/node.tar.gz "$url"
          mkdir -p "${node_dir}"
          tar -xzf /tmp/node.tar.gz -C "${node_dir}" --strip-components=1
          export PATH="${node_dir}/bin:$PATH"
          node --version
          npm --version
          echo "${node_dir}/bin" >> "$GITHUB_PATH"

      - name: 安装依赖
        env:
          npm_config_registry: https://registry.npmmirror.com
        run: |
          for i in 1 2 3; do
            if npm ci; then break; fi
            echo "npm ci 第 ${i} 次失败（多为网络抖动），10s 后重试"
            if [[ ${i} -eq 3 ]]; then exit 1; fi
            sleep 10
          done

      - name: 构建 H5
        run: npm run build:h5
