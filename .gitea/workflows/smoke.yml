# Gitea 环境自检 v4（临时文件，迁移完成后删除）
# v2 结论：MySQL 只是慢（非故障）；artifact v4/v7 ECONNREFUSED；arm64 模拟 EINVAL。
# v3 结论：未改 cache.host 前无有效结论。
# v4 目标（runner config 修正后复测，单次运行拿全）：
#   1. artifact：v2 协议下走 cache server，验证 upload v7 / download v8 往返（正式流水线同款）
#   2. 共享卷：验证宿主目录能否在 job 之间传文件（artifact 不可用时的回退方案）
#   3. arm64：保留探针，已决定只发 amd64，仅作记录
#   4. services：保留 MySQL 就绪耗时（正式 ci.yml 据此设等待）
# 前置：宿主机需存在 /volume1/docker/gitea/gitea_runner/ci-share，且对 job 容器用户可写；
#       5 份 runner config.yaml 必须写同一绝对路径，两处都要配（只配 options 会被静默丢弃）：
#         container.options: --volume <同一路径>:/ci-share
#         container.valid_volumes: ['<同一路径>']
#       若各 runner 指向各自目录，share-write / share-read 落到不同 runner 就传递失败
name: Gitea 环境自检

on:
  workflow_dispatch:
  push:
    paths:
      - '.gitea/workflows/smoke.yml'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    name: 容器 / docker / arm64
    runs-on: ubuntu-latest
    steps:
      - name: 运行上下文与 ACTIONS 端点
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GITHUB_SERVER_URL   = ${GITHUB_SERVER_URL}"
          echo "GITHUB_REPOSITORY   = ${GITHUB_REPOSITORY}"
          echo "GITHUB_RUN_ID       = ${GITHUB_RUN_ID}"
          # 这三个决定 artifact action 往哪发请求，是 ECONNREFUSED 的定位关键
          echo "ACTIONS_RUNTIME_URL = ${ACTIONS_RUNTIME_URL:-<未设置>}"
          echo "ACTIONS_RESULTS_URL = ${ACTIONS_RESULTS_URL:-<未设置>}"
          echo "ACTIONS_CACHE_URL   = ${ACTIONS_CACHE_URL:-<未设置>}"
          echo "token 长度          = ${#GITHUB_TOKEN}"

      - name: 基础工具与 docker daemon
        run: |
          for c in docker git tar zip unzip curl; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "OK   ${c}"
            else
              echo "MISS ${c}"
            fi
          done
          docker buildx version 2>&1 | head -1 || echo "MISS buildx"
          docker info 2>/dev/null | sed -n '/Registry Mirrors/,/^$/p' || true

      - name: Gitea 从 job 容器可达
        run: |
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "${GITHUB_SERVER_URL%/}/api/healthz") || CODE="000"
          echo "healthz HTTP ${CODE}"

      - name: 内核与 binfmt 状态
        continue-on-error: true
        run: |
          echo "内核版本：$(uname -r)"
          echo "--- binfmt_misc status ---"
          cat /proc/sys/fs/binfmt_misc/status 2>&1 || true
          echo "--- 已注册入口 ---"
          ls -1 /proc/sys/fs/binfmt_misc/ 2>&1 || true
          echo "--- 宿主 /lib/modules ---"
          ls -1 /lib/modules 2>&1 | head -5 || true

      # 不使 job 失败：arm64 是否可用是决策输入，不是环境故障
      - name: 尝试 arm64 模拟（两种注册器）
        continue-on-error: true
        run: |
          echo "=== tonistiigi/binfmt ==="
          docker run --privileged --rm tonistiigi/binfmt --install arm64 || echo "tonistiigi 注册失败"
          if docker run --rm --platform linux/arm64 busybox uname -m; then
            echo "RESULT arm64 可用（tonistiigi）"
          else
            echo "RESULT arm64 不可用（tonistiigi）"
          fi

          echo "=== multiarch/qemu-user-static ==="
          docker run --privileged --rm multiarch/qemu-user-static --reset -p yes || echo "multiarch 注册失败"
          if docker run --rm --platform linux/arm64 busybox uname -m; then
            echo "RESULT arm64 可用（multiarch）"
          else
            echo "RESULT arm64 不可用（multiarch）"
          fi

  services:
    name: services 就绪耗时
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-mysql
          MYSQL_DATABASE: market
          TZ: Asia/Shanghai
    steps:
      - name: 等待端口（上限 8 分钟，记录实际耗时）
        continue-on-error: true
        run: |
          wait_port() {
            local host=$1 port=$2 label=$3 start
            start=$(date +%s)
            for _ in $(seq 1 96); do
              if timeout 2 bash -c "cat < /dev/null > /dev/tcp/${host}/${port}" 2>/dev/null; then
                echo "OK   ${label} 就绪，耗时 $(( $(date +%s) - start ))s"
                return 0
              fi
              sleep 5
            done
            echo "FAIL ${label} 8 分钟内不可达"
            return 1
          }
          wait_port redis 6379 redis || true
          wait_port mysql 3306 mysql || true

      - name: 容器状态
        if: always()
        continue-on-error: true
        run: docker ps -a --format 'table {{.Image}}\t{{.Status}}' | grep -E 'IMAGE|mysql|redis' || true

  # cache.host 修正后重测：v2 协议下 artifact 走 cache server，之前 0.0.0.0 导致 ECONNREFUSED
  # 这里测的就是正式流水线要用的版本组合（upload v7 / download v8）
  artifact-roundtrip:
    name: artifact v7→v8 往返
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 准备文件
        run: |
          mkdir -p out
          echo "stamp-${GITHUB_RUN_ID}" > out/stamp.txt
          ls -l out

      - name: 上传 v7
        id: up
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: probe-v7
          path: out

      - name: 下载 v8
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: probe-v7
          path: in

      - name: 结论
        if: always()
        run: |
          if [ -f in/stamp.txt ] && grep -qx "stamp-${GITHUB_RUN_ID}" in/stamp.txt; then
            echo "RESULT artifact 可用（v7 上传 / v8 下载，内容校验通过）"
          else
            echo "RESULT artifact 不可用：上传=「${{ steps.up.outcome }}」，见上文报错"
            echo "        回退方案：共享卷（share-write/share-read）或 cache.v2: false"
          fi

  # github_mirror 只验证过 checkout / artifact；正式流水线还要用下面这些 action，
  # 逐个跑一遍确认镜像站上有对应 tag（缺哪个就在正式工作流里去掉 github_mirror）
  actions-resolve:
    name: action 可达性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup-go v6
        id: go
        continue-on-error: true
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: setup-node v5
        id: node
        continue-on-error: true
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: setup-buildx v4
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v4

      # 顺带验证 Docker Hub 密钥在 Gitea 侧是否可用（release-image 推送依赖它）
      - name: Docker Hub 登录 v4
        id: login
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 汇总
        if: always()
        continue-on-error: true
        run: |
          echo "setup-go        = ${{ steps.go.outcome }}"
          echo "setup-node      = ${{ steps.node.outcome }}"
          echo "setup-buildx    = ${{ steps.buildx.outcome }}"
          echo "dockerhub-login = ${{ steps.login.outcome }}"
          go version 2>&1 | head -1 || true
          node --version 2>&1 || true
          docker buildx version 2>&1 | head -1 || true

  # run 622 结论：job 容器里 docker login 报 registry-1.docker.io 连接超时。
  # 但 push 实际由宿主守护进程执行，容器侧不可达 ≠ 推送不可用，需单独验证；
  # 顺带验证「未缓存镜像」能否拉取（此前所有镜像都是宿主机已有的，未真正验证过拉取链路）。
  registry-probe:
    name: 镜像拉取 / 推送探测
    runs-on: ubuntu-latest
    steps:
      - name: 容器侧出网探测
        continue-on-error: true
        run: |
          for u in https://registry-1.docker.io/v2/ https://auth.docker.io/token; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "$u" 2>/dev/null) || code="000"
            echo "HTTP ${code}  ${u}"
          done
          env | grep -i _proxy || echo "容器内无代理环境变量"

      - name: 未缓存镜像拉取
        continue-on-error: true
        run: |
          docker rmi busybox:1.36 >/dev/null 2>&1 || true
          if timeout 180 docker pull busybox:1.36 > /tmp/pull.log 2>&1; then
            tail -5 /tmp/pull.log
            echo "RESULT 拉取可用（宿主机 + 镜像源链路正常）"
          else
            tail -20 /tmp/pull.log
            echo "RESULT 拉取失败：镜像源列表里有失效镜像（当前含 registry.docker-cn.com 等历史失效项）"
          fi

      # 直接写 ~/.docker/config.json 绕过 docker login 的联网校验：
      # 凭据只需存在于客户端配置，实际推送由宿主守护进程完成
      - name: 推送探测
        continue-on-error: true
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          P: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.docker"
          auth=$(printf '%s:%s' "$U" "$P" | base64 -w0)
          printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' "$auth" > "$HOME/.docker/config.json"
          echo "凭据长度 ${#auth}，用户名 ${U}"
          docker tag redis:7-alpine "${U}/probe:ci"
          if timeout 180 docker push "${U}/probe:ci" > /tmp/push.log 2>&1; then
            tail -8 /tmp/push.log
            echo "RESULT 推送可用：release-image 可以在 Gitea 侧发布"
          else
            tail -20 /tmp/push.log
            echo "RESULT 推送不可用：镜像发布需留在 GitHub，或改用国内 registry 中转"
          fi

  # 依赖 runner config.yaml 的全局挂载（options + valid_volumes 都必须配，路径必须一致）
  share-write:
    name: 共享卷写入
    runs-on: ubuntu-latest
    steps:
      - name: 写入宿主共享目录
        run: |
          if mkdir -p "/ci-share/smoke-${GITHUB_RUN_ID}" \
             && date > "/ci-share/smoke-${GITHUB_RUN_ID}/write.txt"; then
            echo "RESULT 共享卷可写"
            ls -l "/ci-share/smoke-${GITHUB_RUN_ID}"
          else
            echo "RESULT 共享卷不可写：查 config 的 options/valid_volumes 路径是否一致、目录是否 chmod 777"
          fi

  share-read:
    name: 共享卷读取
    runs-on: ubuntu-latest
    needs: [share-write]
    steps:
      - name: 读取并清理
        run: |
          f="/ci-share/smoke-${GITHUB_RUN_ID}/write.txt"
          if [ -f "$f" ]; then
            cat "$f"
            rm -rf "/ci-share/smoke-${GITHUB_RUN_ID}"
            echo "RESULT 共享卷跨 job 传递成功"
          else
            echo "RESULT 共享卷跨 job 传递失败：两个 job 可能落到不同 runner，而各 config 指向了不同宿主目录"
          fi
