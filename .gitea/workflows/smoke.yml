# Gitea 环境自检 v2（临时文件，迁移完成后删除）
# v1 教训：单 job 内任一环节失败会掩盖后续检查，故拆成互不阻塞的 job；
# services 与 artifact 都加了诊断输出，一次跑完即可定案。
# 目的：验证 5 个 Gitea 侧未知项——
#   1. job 容器内 docker CLI / buildx 是否可用、能否连上宿主守护进程
#   2. arm64 QEMU 模拟是否可用（多架构镜像构建前置）
#   3. services 能否按容器名直连（MySQL 首次初始化较慢，等待放宽到 5 分钟）
#   4. artifact action 哪个大版本可用（v3 / v4 / v7 逐个探测）
#   5. GITHUB_TOKEN 是否具备 contents:write（Release 发布前置）
name: Gitea 环境自检

on:
  workflow_dispatch:
  push:
    paths:
      - '.gitea/workflows/smoke.yml'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 无 services、无 checkout：单点验证容器与宿主 docker 的连通性
  tools:
    name: 工具链 / docker / arm64
    runs-on: ubuntu-latest
    steps:
      - name: 运行上下文
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GITHUB_SERVER_URL = ${GITHUB_SERVER_URL}"
          echo "GITHUB_REPOSITORY = ${GITHUB_REPOSITORY}"
          echo "GITHUB_REF_NAME   = ${GITHUB_REF_NAME}"
          echo "GITHUB_RUN_ID     = ${GITHUB_RUN_ID}"
          echo "token 长度        = ${#GITHUB_TOKEN}"
          echo "--- 注入的环境变量名（仅名字，不含值）---"
          env | grep -E '^(GITHUB|ACTIONS|GITEA)_' | cut -d= -f1 | sort

      - name: 基础工具
        run: |
          for c in docker git tar zip unzip curl; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "OK   ${c} -> $(${c} --version 2>&1 | head -1)"
            else
              echo "MISS ${c}"
            fi
          done
          if docker buildx version >/dev/null 2>&1; then
            echo "OK   buildx -> $(docker buildx version 2>&1 | head -1)"
          else
            echo "MISS buildx"
          fi

      - name: docker 守护进程连通
        run: |
          if docker info >/dev/null 2>&1; then
            echo "OK   docker daemon 可达"
            docker info 2>/dev/null | sed -n '/Registry Mirrors/,/^$/p'
          else
            echo "FAIL docker daemon 不可达：container.options 的 docker.sock 挂载未生效"
            exit 1
          fi

      # 关键：job 容器由 runner 派生，与 Gitea 不在同一网络，
      # artifact 上传与 action 下载都依赖这条链路，必须先确认可达
      - name: Gitea 从 job 容器可达
        run: |
          URL="${GITHUB_SERVER_URL%/}/api/healthz"
          echo "探测 ${URL}"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "$URL") || CODE="000"
          echo "HTTP ${CODE}"
          if [[ "$CODE" == "200" ]]; then
            echo "OK   job 容器可访问 Gitea"
          else
            echo "FAIL job 容器无法访问 Gitea：artifact 上传与 action 拉取都会失败"
            exit 1
          fi

      - name: arm64 模拟
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          # 用 arm64 的 busybox 实跑一条命令，确认 binfmt 真生效而不只是注册成功
          docker run --rm --platform linux/arm64 busybox uname -m

      - name: buildx 多架构构建器可用
        run: |
          docker buildx create --name smoketest --driver docker-container --use
          docker buildx inspect --bootstrap
          docker buildx rm smoketest

  services:
    name: services 连通
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-mysql
          MYSQL_DATABASE: market
          TZ: Asia/Shanghai
    steps:
      - name: 等待端口（上限 5 分钟，MySQL 8.0 首次初始化在慢盘上可能超 2 分钟）
        id: wait
        run: |
          wait_port() {
            local host=$1 port=$2 label=$3
            for i in $(seq 1 60); do
              if timeout 2 bash -c "cat < /dev/null > /dev/tcp/${host}/${port}" 2>/dev/null; then
                echo "OK   ${label} ${host}:${port} 可达（第 ${i} 次探测）"
                return 0
              fi
              sleep 3
            done
            echo "FAIL ${label} ${host}:${port} 5 分钟内不可达"
            return 1
          }
          rc=0
          wait_port redis 6379 redis || rc=1
          wait_port mysql 3306 mysql || rc=1
          echo "wait_rc=${rc}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 诊断（等待失败时输出容器状态与日志）
        if: steps.wait.outputs.wait_rc != '0'
        run: |
          echo "=== 全部容器 ==="
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' || true
          echo "=== docker 镜像 ==="
          docker images --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' | head -20 || true
          for id in $(docker ps -aq --filter ancestor=mysql:8.0); do
            echo "=== mysql 容器 ${id} 日志尾部 ==="
            docker logs --tail 80 "$id" 2>&1 || true
          done

      - name: 结论
        run: |
          if [ "${{ steps.wait.outputs.wait_rc }}" != "0" ]; then
            echo "services 不可用，见上方诊断"
            exit 1
          fi
          echo "OK   services 全部可达"

  # artifact 版本探测：act_runner 对 upload-artifact 各版本的兼容性不同，
  # 用 continue-on-error 逐个试，汇总哪个大版本可用
  artifact-probe:
    name: artifact 版本探测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 准备文件
        run: |
          mkdir -p out
          date > out/stamp.txt
          ls -l out

      - name: 探测 v3
        id: probe3
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: probe-v3
          path: out

      - name: 探测 v4
        id: probe4
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: probe-v4
          path: out

      - name: 探测 v7
        id: probe7
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: probe-v7
          path: out

      - name: 汇总
        run: |
          echo "upload-artifact v3 结果：${{ steps.probe3.outcome }}"
          echo "upload-artifact v4 结果：${{ steps.probe4.outcome }}"
          echo "upload-artifact v7 结果：${{ steps.probe7.outcome }}"

  release:
    name: Release 权限（自建自删）
    runs-on: ubuntu-latest
    needs: [tools]
    permissions:
      contents: write
    steps:
      - name: 创建并删除临时 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="${GITHUB_SERVER_URL%/}/api/v1"
          REPO="repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: token ${GITHUB_TOKEN}"
          TAG="smoke-test-$(date +%s)"
          BODY='{"tag_name":"'"${TAG}"'","name":"'"${TAG}"'","prerelease":true,"body":"环境自检，自动删除"}'
          RESP=$(curl -sS -X POST "${API}/${REPO}/releases" \
            -H "$AUTH" -H "Content-Type: application/json" -d "$BODY") || true
          ID=$(echo "${RESP}" | grep -o '"id": *[0-9]*' | head -1 | grep -o '[0-9]*' || true)
          if [ -z "${ID}" ]; then
            echo "FAIL 创建 Release 失败，响应：${RESP}"
            exit 1
          fi
          echo "OK   Release 创建成功 id=${ID} tag=${TAG}"

          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
            "${API}/${REPO}/releases/${ID}" -H "$AUTH") || CODE="000"
          echo "删除 Release：HTTP ${CODE}"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
            "${API}/${REPO}/tags/${TAG}" -H "$AUTH") || CODE="000"
          echo "删除 tag：HTTP ${CODE}"
          if [[ "${CODE}" == "204" || "${CODE}" == "200" ]]; then
            echo "OK   权限具备 contents:write，已自清理"
          else
            echo "WARN tag 清理失败，请手动删除 ${TAG}"
          fi
