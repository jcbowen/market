# 一体化镜像（all-in-one）配置模板
# 与 bin/config.docker.yaml 的差异仅在地址：单容器内 MySQL/Redis/微服务
# 全部监听 127.0.0.1，无 compose 内网服务名。密码等敏感项不写本文件，
# 由容器环境变量注入（MYSQL_PASSWORD/REDIS_PASSWORD/JWT_SECRET，
# 见 common/config.ApplyEnvOverrides）；gateway 启动后会回写运行时快照
# /app/runtime/config.yaml（bind mount 落宿主机），后续 market-admin 等
# 读取快照中的实际值。
web_server:
    port: 18080
    enablessl: false
    certpath: ""
    keypath: ""
db:
    drivername: mysql
    protocol: tcp
    host: 127.0.0.1
    port: "3306"
    dbname: market
    username: root
    # 密码不入库：由 MYSQL_PASSWORD 环境变量注入（Dockerfile/entrypoint 传递）
    password: ""
    charset: utf8mb4
    tableprefix: ""
    parsetime: "True"
    loc: Local
    singulartable: true
    disableforeignkeyconstraintwhenmigrating: true
redis:
    host: 127.0.0.1
    port: "6379"
    # 密码不入库：由 REDIS_PASSWORD 环境变量注入
    password: ""
    db: "0"
project:
    name: 社区商超
grpc:
    user_service: 127.0.0.1:50051
    product_service: 127.0.0.1:50052
    order_service: 127.0.0.1:50053
    cart_service: 127.0.0.1:50054
    payment_service: 127.0.0.1:50055
jwt:
    # 密钥不入仓库：all-in-one 由 entrypoint.sh 集中生成或读 JWT_SECRET 环境变量，
    # 再注入容器内 7 个进程（同容器共享环境，token 互认一致）
    secret: ""
    access_token_ttl: 7200
    refresh_token_ttl: 604800
security:
    # 可信反向代理网段（CIDR 或单个 IP），空 = 不信任任何代理头（只认直连地址）。
    # all-in-one 由宿主 nginx 反代时，用 docker run -e TRUSTED_PROXIES=<网段> 注入即可
    # （common/config.ApplyEnvOverrides 覆盖本项，无需改镜像内配置）；
    # 未配置时限流与访问日志会把所有用户合并成代理 IP，填 0.0.0.0/0 则等于放开伪造
    trusted_proxies: []
    # 可信平台专用头（前置 CDN 时填代理强制覆盖写入的客户端真实 IP 头，客户端伪造无效）：
    # 阿里云 CDN 填 Ali-CDN-Real-IP，Cloudflare 填 CF-Connecting-IP；头缺失时回落直连/代理网段逻辑。
    # 也可 docker run -e TRUSTED_PLATFORM=Ali-CDN-Real-IP 注入，留空不启用
    trusted_platform: ""
    # 登录密码传输加密的 RSA 私钥文件路径（推荐方式）：/app/data 整体落宿主机 bind mount，
    # 首启自动生成并落盘（0600），重建容器/升级镜像密钥不换；多实例部署挂载同一宿主文件共享，
    # 建议预生成 openssl genrsa -out <宿主data目录>/ssl/pwd_rsa.pem 2048 后挂载
    password_rsa_key_file: /app/data/ssl/pwd_rsa.pem
    # 登录密码传输加密的 RSA 私钥（PEM 内联，兼容保留；优先级低于上方 key_file 与对应 ENV，
    # 经 PASSWORD_RSA_PRIVATE_KEY 环境变量注入时 PEM 换行写 \n 转义）
    password_rsa_private_key: ""
log:
    level: info
    format: json
    file_path: logs/
    max_size: 100
    max_backups: 30
    max_age: 7
    compress: true
upload:
    max_size: 10485760
    allowed_types: []
    storage: local
    local_path: static/uploads/
geoip:
    db_path: data/geoip/GeoLite2-City.mmdb
wechat:
    # 小程序登录凭证已迁移至数据库 client_channels 表（后台「渠道管理」维护），
    # 此处留空；支付/短信等配置见数据库 pay_config 表
    app_id: ""
    app_secret: ""
    mch_id: ""
    api_v3_key: ""
    cert_serial_no: ""
    private_key: ""
    notify_url: ""
sms:
    provider: aliyun
    access_key: ""
    secret_key: ""
    sign_name: 社区商超
    template_code: ""
    code_expire: 300
    send_interval: 60
business:
    expire_warning_days: 3
    order_timeout: 1800
    auto_complete_days: 7
    # 支付对账与回调可靠性（渠道为事实来源的最终一致兜底），payment 与 order 服务共同读取：
    # enabled 总开关（关闭=退回纯回调确认 + 纯本地关单）；cancel_guard 取消前置渠道确认（受 enabled 约束）；
    # auto_refund_stuck 挂账自动退款——默认关闭，渠道退款回执需真实商户号联调验证后才能开启
    payment_reconcile:
        enabled: true
        cancel_guard: true
        auto_refund_stuck: false
        pending_max_minutes: 120     # 待支付单回查时间上界；支付宝侧取 min(本值, order_timeout)
        closed_lookback_minutes: 1440 # 已关单挂账回溯窗口：迟到付款（关单后才到账）也能被扫到
        closed_throttle_minutes: 30   # 已关单回溯最小间隔，比在途回查低频以控渠道调用成本
        interval_seconds: 60         # 对账轮询间隔
        min_age_seconds: 60          # 支付单创建后至少等待多久才回查（给正常回调留时间）
        throttle_minutes: 5          # 同一支付单两次回查最小间隔
        max_reconcile_count: 24      # 累计回查上限，超限写「放弃对账」流水并停止
        batch_size: 100              # 单轮每类扫描条数上限
        notify_log_retention_days: 30 # 通知/对账流水保留天数
# debugger 请求日志（jcbaseGo 组件）：写共享 debug_logs 表，前端页面 /jcbase/debug；
# 生产默认关闭。临时排查三件套：DEBUGGER_ENABLED=1 + DEBUGGER_ALLOWED_IPS=<运维 IP/CIDR>
# （不给白名单则页面不注册，只记日志），排查完立刻关回：开启态每个采样请求都同步写库，
# 并有额外内存与 DB 容量成本，故示例值收紧为采样 0.1 / 上限 5000 条 / 保留 3 天
debugger:
    enabled: false
    # 服务标识（debug_logs 日志来源）：gateway（请求日志+调试页面）与 payment/order
    # （进程级记录，共享同一张表）均读取该字段；entrypoint 分发副本时会把非 gateway
    # 副本覆写为各自进程名，此处值仅 gateway 副本生效
    service_name: gateway
    # 建议经 DEBUGGER_ALLOWED_IPS 注入，配置文件不写死运维 IP；留空 = 页面不注册（fail-closed）
    allowed_ips: []
    allow_empty_whitelist: false
    # 无 0 语义：写 0 会被框架回填为默认 16
    max_body_size: 16
    # 0 = 不限制条数（不写 = 默认 5000）
    max_records: 5000
    # 0 = 不做过期清理（不写 = 默认 7 天）；任何取值都不会清空全表
    retention_days: 3
    # 无 0 语义：写 0 会被框架回填为默认 24
    cleanup_interval_hours: 24
    # 0 = 一条都不记录（不写 = 全量）；线上开启态建议 0.1
    sample_rate: 0.1
    # 只影响日志里记录的 client_ip 取法，不参与页面鉴权。
    # 一体化镜像内置 nginx 时保持 false，改为放行其网段（TRUSTED_PROXIES）
    use_cdn: false
    base_path: /jcbase/debug
    skip_paths: []
user_service:
    grpc_port: 50051
product_service:
    grpc_port: 50052
order_service:
    grpc_port: 50053
cart_service:
    grpc_port: 50054
payment_service:
    grpc_port: 50055
