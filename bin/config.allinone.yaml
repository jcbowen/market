# 一体化镜像（all-in-one）配置模板
# 与 bin/config.docker.yaml 的差异仅在地址：单容器内 MySQL/Redis/微服务
# 全部监听 127.0.0.1，无 compose 内网服务名。密码等敏感项不写本文件，
# 由容器环境变量注入（MYSQL_PASSWORD/REDIS_PASSWORD/JWT_SECRET，
# 见 common/config.ApplyEnvOverrides）；gateway 启动后会回写运行时快照
# /app/runtime/config.yaml（bind mount 落宿主机），后续 market-admin 等
# 读取快照中的实际值。
web_server:
    port: 18080
    enablessl: false
    certpath: ""
    keypath: ""
db:
    drivername: mysql
    protocol: tcp
    host: 127.0.0.1
    port: "3306"
    dbname: market
    username: root
    # 密码不入库：由 MYSQL_PASSWORD 环境变量注入（Dockerfile/entrypoint 传递）
    password: ""
    charset: utf8mb4
    tableprefix: ""
    parsetime: "True"
    loc: Local
    singulartable: true
    disableforeignkeyconstraintwhenmigrating: true
redis:
    host: 127.0.0.1
    port: "6379"
    # 密码不入库：由 REDIS_PASSWORD 环境变量注入
    password: ""
    db: "0"
project:
    name: 社区商超
grpc:
    user_service: 127.0.0.1:50051
    product_service: 127.0.0.1:50052
    order_service: 127.0.0.1:50053
    cart_service: 127.0.0.1:50054
    payment_service: 127.0.0.1:50055
jwt:
    secret: market-secret-key-change-in-production
    access_token_ttl: 7200
    refresh_token_ttl: 604800
log:
    level: info
    format: json
    file_path: logs/
    max_size: 100
    max_backups: 30
    max_age: 7
    compress: true
upload:
    max_size: 10485760
    allowed_types: []
    storage: local
    local_path: static/uploads/
geoip:
    db_path: data/geoip/GeoLite2-City.mmdb
wechat:
    # 小程序登录凭证已迁移至数据库 client_channels 表（后台「渠道管理」维护），
    # 此处留空；支付/短信等配置见数据库 pay_config 表
    app_id: ""
    app_secret: ""
    mch_id: ""
    api_v3_key: ""
    cert_serial_no: ""
    private_key: ""
    notify_url: ""
sms:
    provider: aliyun
    access_key: ""
    secret_key: ""
    sign_name: 社区商超
    template_code: ""
    code_expire: 300
    send_interval: 60
business:
    expire_warning_days: 3
    order_timeout: 1800
    auto_complete_days: 7
user_service:
    grpc_port: 50051
product_service:
    grpc_port: 50052
order_service:
    grpc_port: 50053
cart_service:
    grpc_port: 50054
payment_service:
    grpc_port: 50055
