    api_v3_key: ""
    cert_serial_no: ""
    private_key: ""
    notify_url: http://localhost:18080/api/v1/payments/callback/wechat
sms:
    provider: aliyun
    access_key: ""
    secret_key: ""
    sign_name: 社区商超
    template_code: ""
    code_expire: 300
    send_interval: 60
business:
    expire_warning_days: 3
    order_timeout: 1800
    auto_complete_days: 7
user_service:
    grpc_port: 50051
product_service:
    grpc_port: 50052
order_service:
    grpc_port: 50053
cart_service:
