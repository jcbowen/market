web_server:
    port: 18080
    enablessl: false
    certpath: ""
    keypath: ""
db:
    drivername: mysql
    protocol: tcp
    host: localhost
    port: "3306"
    dbname: market
    username: root
    password: ""
    charset: utf8mb4
    tableprefix: ""
    parsetime: "False"
    loc: Local
    singulartable: true
    disableforeignkeyconstraintwhenmigrating: false
redis:
    host: localhost
    port: "6379"
    password: ""
    db: "0"
project:
    name: 社区商超
grpc:
    user_service: localhost:50051
    product_service: localhost:50052
    order_service: localhost:50053
    cart_service: localhost:50054
    payment_service: localhost:50055
jwt:
    secret: market-secret-key-change-in-production
    access_token_ttl: 7200
    refresh_token_ttl: 604800
