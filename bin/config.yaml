    access_key: ""
    secret_key: ""
    sign_name: 社区商超
    template_code: ""
    code_expire: 300
    send_interval: 60
business:
    expire_warning_days: 3
    order_timeout: 1800
    auto_complete_days: 7
# debugger 请求日志（jcbaseGo 组件）：写共享 debug_logs 表，前端页面 /jcbase/debug
# 本地全量便于排查；凭据掩码默认开启，认证/支付回调/上传路由整条不入库
debugger:
    enabled: true
    service_name: gateway
    # 白名单走 gin 的 ClientIP 判定（可信代理由 security.trusted_proxies 决定）
    # 留空则调试页面不注册（fail-closed），只记日志
    allowed_ips: ["127.0.0.1", "::1"]
    allow_empty_whitelist: false
    max_body_size: 16
    # 0 = 不限制条数（不写 = 默认 5000）
    max_records: 5000
    # 0 = 不做过期清理（不写 = 默认 7 天）；任何取值都不会清空全表
    retention_days: 7
    # 无 0 语义：写 0 会被框架回填为默认 24
    cleanup_interval_hours: 24
    # 0 = 一条都不记录（不写 = 全量）
    sample_rate: 1.0
    # 只影响日志里记录的 client_ip 取法，不参与页面鉴权；生产保持 false 并配 trusted_proxies
    use_cdn: false
    base_path: /jcbase/debug
    skip_paths: []
    # 三态项不写即用组件默认（掩码开启、上传文件只记元数据、复制请求体保证业务可用）
    # mask_body: true
    # multipart_skip_files: true
    # multipart_preserve_state: true
    # header_mask_keys: []
    # body_mask_keys: []
user_service:
    grpc_port: 50051
product_service:
    grpc_port: 50052
order_service:
    grpc_port: 50053
cart_service:
    grpc_port: 50054
payment_service:
    grpc_port: 50055
