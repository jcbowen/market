web_server:
    port: 18080
    enablessl: false
    certpath: ""
    keypath: ""
db:
    drivername: mysql
    protocol: tcp
    host: localhost
    port: "3306"
    dbname: market
    username: root
    password: ""
    charset: utf8mb4
    tableprefix: ""
    parsetime: "False"
    loc: Local
    singulartable: true
    disableforeignkeyconstraintwhenmigrating: false
redis:
    host: localhost
    port: "6379"
    password: ""
    db: "0"
project:
    name: 社区商超
grpc:
    user_service: localhost:50051
    product_service: localhost:50052
    order_service: localhost:50053
    cart_service: localhost:50054
    payment_service: localhost:50055
jwt:
    secret: market-secret-key-change-in-production
    access_token_ttl: 7200
    refresh_token_ttl: 604800
log:
    level: info
    format: json
    file_path: logs/
    max_size: 100
    max_backups: 30
    max_age: 7
    compress: true
upload:
    max_size: 10485760
    allowed_types:
        - jpg
        - jpeg
        - png
        - gif
        - webp
    storage: local
    local_path: static/uploads/
geoip:
    db_path: data/geoip/GeoLite2-City.mmdb
wechat:
    app_id: wx_test_appid
    app_secret: ""
    mch_id: "1234567890"
    api_v3_key: ""
    cert_serial_no: ""
    private_key: ""
    notify_url: http://localhost:18080/api/v1/payments/callback/wechat
security:
    trusted_proxies: []
    trusted_platform: ""
sms:
    provider: aliyun
    access_key: ""
    secret_key: ""
    sign_name: 社区商超
    template_code: ""
    code_expire: 300
    send_interval: 60
business:
    expire_warning_days: 3
    order_timeout: 1800
    auto_complete_days: 7
    payment_reconcile:
        enabled: null
        cancel_guard: null
        auto_refund_stuck: null
        pending_max_minutes: 120
        interval_seconds: 60
        min_age_seconds: 60
        throttle_minutes: 5
        max_reconcile_count: 24
        batch_size: 100
        notify_log_retention_days: 30
debugger:
    # 出厂默认关闭（发布模板随 CI 打进 release 包）：调试页面有同机反代未配
    # trusted_proxies 时 ClientIP 恒为 127.0.0.1 而绕过白名单的风险，
    # 需要排查时改 true 或注入 DEBUGGER_ENABLED=1，勿随发布包默认开启
    enabled: false
    service_name: gateway
    allowed_ips:
        - 127.0.0.1
        - ::1
    allow_empty_whitelist: false
    max_body_size: 16
    max_records: 5000
    retention_days: 7
    cleanup_interval_hours: 24
    sample_rate: 1
    use_cdn: false
    base_path: /jcbase/debug
    skip_paths: []
    mask_body: null
    header_mask_keys: []
    # 精确键名掩码补齐：组件内置仅覆盖 password/token/captcha 等通用词，
    # 支付 V3 密钥/私钥/OSS 凭据类键名不在其中，落库前须替换为定长掩码
    body_mask_keys:
        - api_v3_key
        - private_key
        - oss_access_key_secret
        - access_key_secret
        - app_secret
    multipart_skip_files: null
    multipart_preserve_state: null
user_service:
    grpc_port: 50051
product_service:
    grpc_port: 50052
order_service:
    grpc_port: 50053
cart_service:
    grpc_port: 50054
payment_service:
    grpc_port: 50055
