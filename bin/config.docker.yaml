web_server:
    port: 18080
    enablessl: false
    certpath: ""
    keypath: ""
db:
    drivername: mysql
    protocol: tcp
    host: mysql
    port: "3306"
    dbname: market
    username: root
    # 密码不入库：由 MYSQL_PASSWORD 环境变量注入（docker-compose.yml / .env）
    password: ""
    charset: utf8mb4
    tableprefix: ""
    parsetime: "True"
    loc: Local
    singulartable: true
    disableforeignkeyconstraintwhenmigrating: true
redis:
    host: redis
    port: "6379"
    # 密码不入库：由 REDIS_PASSWORD 环境变量注入（docker-compose.yml / .env）
    password: ""
    db: "0"
project:
    name: 社区商超
grpc:
    user_service: user-service:50051
    product_service: product-service:50052
    order_service: order-service:50053
    cart_service: cart-service:50054
    payment_service: payment-service:50055
jwt:
    # 密钥不入仓库：由 compose 经 JWT_SECRET 环境变量注入（缺失时服务拒绝启动，
    # 见 common/config.EnsureSecureJWT）；此处留空即为「未配置」，与历史硬编码
    # 默认占位串的区别是后者随 git 公开、可被用来伪造超管 token
    secret: ""
    access_token_ttl: 7200
    refresh_token_ttl: 604800
security:
    # 可信反向代理网段（CIDR 或单个 IP），决定 ClientIP 是否采信 X-Forwarded-For 等代理头。
    # 空 = 不信任任何代理（只认直连地址），伪造代理头绕过限流的口子由此封死。
    # 生产为宿主机 nginx 反代容器发布端口时必须配置为 compose 网络实际网段
    # （docker network inspect market_default 取 Configurations.Subnet，如 172.18.0.0/16）；
    # 留空会让所有用户共用网桥地址这一个限流桶（整站 429），填 0.0.0.0/0 等于放开伪造。
    # 也可不改本文件、改由 compose 的 TRUSTED_PROXIES 环境变量注入（ApplyEnvOverrides 覆盖）
    trusted_proxies: []
log:
    level: info
    format: json
    file_path: logs/
    max_size: 100
    max_backups: 30
    max_age: 7
    compress: true
upload:
    max_size: 10485760
    allowed_types: []
    storage: local
    local_path: static/uploads/
geoip:
    db_path: data/geoip/GeoLite2-City.mmdb
wechat:
    app_id: wx_test_appid
    app_secret: ""
    mch_id: "1234567890"
    api_v3_key: ""
    cert_serial_no: ""
    private_key: ""
    notify_url: http://localhost:18080/api/v1/payments/callback/wechat
sms:
    provider: aliyun
    access_key: ""
    secret_key: ""
    sign_name: 社区商超
    template_code: ""
    code_expire: 300
    send_interval: 60
business:
    expire_warning_days: 3
    order_timeout: 1800
    auto_complete_days: 7
user_service:
    grpc_port: 50051
product_service:
    grpc_port: 50052
order_service:
    grpc_port: 50053
cart_service:
    grpc_port: 50054
payment_service:
    grpc_port: 50055
