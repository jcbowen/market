web_server:
    port: 18080
    enablessl: false
    certpath: ""
    keypath: ""
db:
    drivername: mysql
    protocol: tcp
    host: mysql
    port: "3306"
    dbname: market
    username: root
    # 账号/密码不入库：compose 两套文件经 DB_USER + MYSQL_PASSWORD 注入业务账号
    # （db-grant 任务建号并限定 market 库）；all-in-one 单容器仍用 root + MYSQL_PASSWORD
    password: ""
    charset: utf8mb4
    tableprefix: ""
    parsetime: "True"
    loc: Local
    singulartable: true
    disableforeignkeyconstraintwhenmigrating: true
redis:
    host: redis
    port: "6379"
    # 密码不入库：由 REDIS_PASSWORD 环境变量注入（docker-compose.yml / .env）
    password: ""
    db: "0"
project:
    name: 社区商超
grpc:
    user_service: user-service:50051
    product_service: product-service:50052
    order_service: order-service:50053
    cart_service: cart-service:50054
    payment_service: payment-service:50055
jwt:
    # 密钥不入仓库：由 compose 经 JWT_SECRET 环境变量注入（缺失时服务拒绝启动，
    # 见 common/config.EnsureSecureJWT）；此处留空即为「未配置」，与历史硬编码
    # 默认占位串的区别是后者随 git 公开、可被用来伪造超管 token
    secret: ""
    access_token_ttl: 7200
    refresh_token_ttl: 604800
security:
    # 可信反向代理网段（CIDR 或单个 IP），决定 ClientIP 是否采信 X-Forwarded-For 等代理头。
    # 空 = 不信任任何代理（只认直连地址），伪造代理头绕过限流的口子由此封死。
    # 生产为宿主机 nginx 反代容器发布端口时必须配置为 compose 网络实际网段
    # （docker network inspect market_default 取 Configurations.Subnet，如 172.18.0.0/16）；
    # 留空会让所有用户共用网桥地址这一个限流桶（整站 429），填 0.0.0.0/0 等于放开伪造。
    # 也可不改本文件、改由 compose 的 TRUSTED_PROXIES 环境变量注入（ApplyEnvOverrides 覆盖）
    trusted_proxies: []
    # 可信平台专用头（前置 CDN 时填代理强制覆盖写入的客户端真实 IP 头，客户端伪造无效）：
    # 阿里云 CDN 填 Ali-CDN-Real-IP，Cloudflare 填 CF-Connecting-IP；头缺失时回落直连/代理网段逻辑。
    # 也可不改本文件、改由 compose 的 TRUSTED_PLATFORM 环境变量注入，留空不启用
    trusted_platform: ""
    # 接口 IP 洪水兜底阈值（速率/突发容量，仅 gateway 读取）：作用于 /api/v1 与 /api/v1/admin
    # 两个分组（静态资源不吃该桶），超限回 HTTP 429 + 业务码 10005 + Retry-After: 1。
    # 缺省 100/150，面向真实人机流量，生产不必配置；本机整套接口用例从同一 IP 打出
    # 峰值 116~133 r/s 会贴着阈值撞出随机 429，本地 compose 已用环境变量上调到 2000/3000。
    # 需要改这里而非环境变量时，按下面两行取消注释并填值（非正数按缺省处理）
    # api_rate_qps: 100
    # api_rate_burst: 150
    # 登录密码传输加密的 RSA 私钥文件路径（推荐方式，仅 gateway 读取；协议见 docs 06-接口设计「密码传输加密约定」）。
    # 容器内路径由 docker-compose.yml 挂载 ./bin/data/ssl 提供：文件不存在时启动自动生成并落盘（0600），
    # 容器重建 key_id 不变；多实例/负载均衡部署挂载同一宿主文件即共享同一密钥对
    # （建议预生成：openssl genrsa -out bin/data/ssl/pwd_rsa.pem 2048，避免多实例同时首启的生成竞争）。
    # Linux 宿主需 chown -R 10001:10001 bin/data/ssl；也可经 PASSWORD_RSA_PRIVATE_KEY_FILE 环境变量注入路径
    password_rsa_key_file: /app/data/ssl/pwd_rsa.pem
    # 登录密码传输加密的 RSA 私钥（PEM 内联，兼容保留；优先级低于上方 key_file 与对应 ENV）。
    # 多行 PEM 经 PASSWORD_RSA_PRIVATE_KEY 环境变量注入时换行写 \n 转义；两处均空 = 纯内存临时密钥（重启更换）
    password_rsa_private_key: ""
log:
    level: info
    format: json
    file_path: logs/
    max_size: 100
    max_backups: 30
    max_age: 7
    compress: true
upload:
    max_size: 10485760
    allowed_types: []
    storage: local
    local_path: static/uploads/
geoip:
    db_path: data/geoip/GeoLite2-City.mmdb
wechat:
    app_id: wx_test_appid
    app_secret: ""
    mch_id: "1234567890"
    api_v3_key: ""
    cert_serial_no: ""
    private_key: ""
    notify_url: http://localhost:18080/api/v1/payments/callback/wechat
sms:
    provider: aliyun
    access_key: ""
    secret_key: ""
    sign_name: 社区商超
    template_code: ""
    code_expire: 300
    send_interval: 60
business:
    expire_warning_days: 3
    order_timeout: 1800
    auto_complete_days: 7
    # 支付对账与回调可靠性（渠道为事实来源的最终一致兜底），payment 与 order 服务共同读取：
    # enabled 总开关（关闭=退回纯回调确认 + 纯本地关单）；cancel_guard 取消前置渠道确认（受 enabled 约束）；
    # auto_refund_stuck 挂账自动退款——默认关闭，渠道退款回执需真实商户号联调验证后才能开启
    payment_reconcile:
        enabled: true
        cancel_guard: true
        auto_refund_stuck: false
        pending_max_minutes: 120     # 待支付单回查时间上界；支付宝侧取 min(本值, order_timeout)
        closed_lookback_minutes: 1440 # 已关单挂账回溯窗口：迟到付款（关单后才到账）也能被扫到
        closed_throttle_minutes: 30   # 已关单回溯最小间隔，比在途回查低频以控渠道调用成本
        interval_seconds: 60         # 对账轮询间隔
        min_age_seconds: 60          # 支付单创建后至少等待多久才回查（给正常回调留时间）
        throttle_minutes: 5          # 同一支付单两次回查最小间隔
        max_reconcile_count: 24      # 累计回查上限，超限写「放弃对账」流水并停止
        batch_size: 100              # 单轮每类扫描条数上限
        notify_log_retention_days: 30 # 通知/对账流水保留天数
# debugger 请求日志（jcbaseGo 组件）：写共享 debug_logs 表，前端页面 /jcbase/debug；
# 生产默认关闭。临时排查三件套：DEBUGGER_ENABLED=1 + DEBUGGER_ALLOWED_IPS=<运维 IP/CIDR>
# （不给白名单则页面不注册，只记日志），排查完立刻关回：开启态每个采样请求都同步写库，
# 并有额外内存与 DB 容量成本，故示例值收紧为采样 0.1 / 上限 5000 条 / 保留 3 天
debugger:
    enabled: false
    service_name: gateway
    # 建议经 DEBUGGER_ALLOWED_IPS 注入，配置文件不写死运维 IP；留空 = 页面不注册（fail-closed）
    allowed_ips: []
    allow_empty_whitelist: false
    # 无 0 语义：写 0 会被框架回填为默认 16
    max_body_size: 16
    # 0 = 不限制条数（不写 = 默认 5000）
    max_records: 5000
    # 0 = 不做过期清理（不写 = 默认 7 天）；任何取值都不会清空全表
    retention_days: 3
    # 无 0 语义：写 0 会被框架回填为默认 24
    cleanup_interval_hours: 24
    # 0 = 一条都不记录（不写 = 全量）；线上开启态建议 0.1
    sample_rate: 0.1
    # 只影响日志里记录的 client_ip 取法，不参与页面鉴权。
    # 前置 nginx/CDN 时保持 false，改为放行其网段（TRUSTED_PROXIES），否则 ClientIP 会被代理头伪造
    use_cdn: false
    base_path: /jcbase/debug
    skip_paths: []
user_service:
    grpc_port: 50051
product_service:
    grpc_port: 50052
order_service:
    grpc_port: 50053
cart_service:
    grpc_port: 50054
payment_service:
    grpc_port: 50055
